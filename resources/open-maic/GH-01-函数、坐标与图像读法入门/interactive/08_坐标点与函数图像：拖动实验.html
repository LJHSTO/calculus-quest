<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let state = {
  running: false,
  paused: false,
  ended: false,
  functionType: 'linear',
  dots: [],
  dragging: null,
  lockedCount: 0,
  animationId: null,
  glowPhase: 0,
  particles: []
};

// Config
let config = {
  numDots: 6,
  snapTolerance: 35,
  showHints: 1
};

// Coordinate system
let origin = { x: 0, y: 0 };
let scaleX = 60, scaleY = 60;
let canvasW = 0, canvasH = 0;

// Function definitions
const functions = {
  linear: {
    fn: (x) => 2 * x + 1,
    label: 'y = 2x + 1',
    xRange: [-2, 3],
    yRange: [-3, 8]
  },
  quadratic: {
    fn: (x) => x * x,
    label: 'y = x²',
    xRange: [-3, 3],
    yRange: [-1, 10]
  },
  sine: {
    fn: (x) => Math.sin(x),
    label: 'y = sin(x)',
    xRange: [-Math.PI, Math.PI],
    yRange: [-2, 2]
  },
  cubic: {
    fn: (x) => Math.pow(x, 3) / 5,
    label: 'y = x³/5',
    xRange: [-3, 3],
    yRange: [-5, 5]
  }
};

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  if (ctx) if (ctx) ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  canvasW = rect.width;
  canvasH = rect.height;
  updateCoordinateSystem();
  draw();
}

function updateCoordinateSystem() {
  const fn = functions[state.functionType];
  scaleX = Math.max(1, canvasW - 100) / (fn.xRange[1] - fn.xRange[0]);
  scaleY = Math.max(1, canvasH - 120) / (fn.yRange[1] - fn.yRange[0]);
}
function m2c(mx, my) {
  const fn = functions[state.functionType];
  return {x: canvasW / 2 + (mx - (fn.xRange[0] + fn.xRange[1]) / 2) * scaleX,
    y: canvasH / 2 - (my - (fn.yRange[0] + fn.yRange[1]) / 2) * scaleY};
}
function c2m(cx, cy) {
  const fn = functions[state.functionType];
  return {x: (cx - canvasW / 2) / scaleX + (fn.xRange[0] + fn.xRange[1]) / 2,
    y: -(cy - canvasH / 2) / scaleY + (fn.yRange[0] + fn.yRange[1]) / 2};
}
function mathToCanvas(mx,my) {return m2c(mx,my);}
function canvasToMath(cx,cy) {return c2m(cx,cy);}
function recalcCoords() {updateCoordinateSystem();}

function initDots() {
  const fn = functions[state.functionType];
  const numDots = config.numDots;
  const xMin = fn.xRange[0], xMax = fn.xRange[1];
  state.dots = [];
  state.lockedCount = 0;

  for (let i = 0; i < numDots; i++) {
    const t = numDots === 1 ? 0.5 : i / (numDots - 1);
    const mx = xMin + t * (xMax - xMin);
    const correctMy = fn.fn(mx);
    const canvasPos = m2c(mx, correctMy);

    state.dots.push({
      mx: mx,
      my: 0, // Start at y=0
      correctMy: correctMy,
      locked: false,
      glowIntensity: 0,
      canvasX: canvasPos.x,
      canvasY: canvasPos.y,
      color: '#f97316'
    });
  }
  updateProgress();
}

function drawGrid() {
  const fn = functions[state.functionType];

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Subtle grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;

  const xMin = fn.xRange[0], xMax = fn.xRange[1];
  const yMin = fn.yRange[0], yMax = fn.yRange[1];

  // Vertical grid lines
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    const pos = m2c(x, 0);
    ctx.beginPath();
    ctx.moveTo(pos.x, 20);
    ctx.lineTo(pos.x, canvasH - 20);
    ctx.stroke();
  }

  // Horizontal grid lines
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    const pos = m2c(0, y);
    ctx.beginPath();
    ctx.moveTo(20, pos.y);
    ctx.lineTo(canvasW - 20, pos.y);
    ctx.stroke();
  }

  // Axes
  const originPos = m2c(0, 0);
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;

  // X-axis
  ctx.beginPath();
  ctx.moveTo(10, originPos.y);
  ctx.lineTo(canvasW - 10, originPos.y);
  ctx.stroke();

  // Y-axis
  ctx.beginPath();
  ctx.moveTo(originPos.x, 10);
  ctx.lineTo(originPos.x, canvasH - 10);
  ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#64748b';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';

  // X-axis numbers
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    if (x === 0) continue;
    const pos = m2c(x, 0);
    ctx.fillText(x.toString(), pos.x, originPos.y + 18);
  }

  // Y-axis numbers
  ctx.textAlign = 'right';
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    if (y === 0) continue;
    const pos = m2c(0, y);
    ctx.fillText(y.toString(), originPos.x - 8, pos.y + 4);
  }

  // Origin label
  ctx.textAlign = 'center';
  ctx.fillText('O', originPos.x - 10, originPos.y + 16);

  // Axis names
  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('x', canvasW - 20, originPos.y - 10);
  ctx.save();
  ctx.translate(originPos.x + 15, 20);
  ctx.fillText('y', 0, 0);
  ctx.restore();
}

function drawFunctionCurve() {
  const fn = functions[state.functionType];
  const xMin = fn.xRange[0], xMax = fn.xRange[1];

  ctx.strokeStyle = 'rgba(167, 139, 250, 0.25)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();

  let started = false;
  for (let px = 0; px <= canvasW; px += 2) {
    const math = c2m(px, canvasH / 2);
    const y = fn.fn(math.x);
    const pos = m2c(math.x, y);
    if (!started) {
      ctx.moveTo(pos.x, pos.y);
      started = true;
    } else {
      ctx.lineTo(pos.x, pos.y);
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTargetMarkers() {
  if (!state.running || state.ended) return;

  state.dots.forEach((dot, i) => {
    if (dot.locked) return;

    const correctPos = m2c(dot.mx, dot.correctMy);

    // Vertical dashed line from x-axis to correct y
    const xAxPos = m2c(dot.mx, 0);
    ctx.strokeStyle = 'rgba(249, 115, 22, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xAxPos.x, xAxPos.y);
    ctx.lineTo(correctPos.x, correctPos.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Correct position indicator (small circle)
    ctx.beginPath();
    ctx.arc(correctPos.x, correctPos.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(52, 211, 153, 0.3)';
    ctx.fill();

    // X label
    ctx.fillStyle = 'rgba(249, 115, 22, 0.5)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    const spacing = Math.max(1,(canvasW-100)/Math.max(1,state.dots.length-1));
    const rows = Math.max(1,Math.ceil(ctx.measureText('x=-3.0').width / spacing));
    ctx.fillText('x=' + dot.mx.toFixed(1), xAxPos.x, xAxPos.y + 22 + (i % rows) * 14);
  });
}

function drawHintLines() {
  if (!config.showHints || !state.running || state.ended) return;

  state.dots.forEach(dot => {
    if (dot.locked) return;
    const correctPos = m2c(dot.mx, dot.correctMy);
    const dotPos = m2c(dot.mx, dot.my);

    // Distance indicator
    const dy = Math.abs(correctPos.y - dotPos.y);
    if (dy > 5) {
      ctx.strokeStyle = `rgba(${dy > config.snapTolerance ? '239,68,68' : '52,211,153'}, 0.4)`;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(dotPos.x + 15, dotPos.y);
      ctx.lineTo(dotPos.x + 15, correctPos.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrow
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      if (correctPos.y < dotPos.y) {
        ctx.moveTo(dotPos.x + 10, dotPos.y - 2);
        ctx.lineTo(dotPos.x + 15, dotPos.y - 8);
        ctx.lineTo(dotPos.x + 20, dotPos.y - 2);
      } else {
        ctx.moveTo(dotPos.x + 10, dotPos.y + 2);
        ctx.lineTo(dotPos.x + 15, dotPos.y + 8);
        ctx.lineTo(dotPos.x + 20, dotPos.y + 2);
      }
      ctx.fill();
    }
  });
}

function drawDot(dot, index) {
  const pos = m2c(dot.mx, dot.my);
  const radius = 12;

  // Update canvas positions
  dot.canvasX = pos.x;
  dot.canvasY = pos.y;

  // Glow effect for locked dots
  if (dot.locked) {
    dot.glowIntensity = Math.min(1, dot.glowIntensity + 0.05);
    const glowRadius = radius + 8 + Math.sin(state.glowPhase + index) * 4;

    const gradient = ctx.createRadialGradient(((Number.isFinite(Number(pos.x)) ? Number(pos.x) : 0)), ((Number.isFinite(Number(pos.y)) ? Number(pos.y) : 0)), Math.max(0, ((Number.isFinite(Number(radius)) ? Number(radius) : 0))), ((Number.isFinite(Number(pos.x)) ? Number(pos.x) : 0)), ((Number.isFinite(Number(pos.y)) ? Number(pos.y) : 0)), Math.max(1, ((Number.isFinite(Number(glowRadius)) ? Number(glowRadius) : 1))));
    gradient.addColorStop(0, 'rgba(52, 211, 153, 0.6)');
    gradient.addColorStop(0.5, 'rgba(52, 211, 153, 0.2)');
    gradient.addColorStop(1, 'rgba(52, 211, 153, 0)');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Ring animation
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius + 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(52, 211, 153, ' + (0.5 + Math.sin(state.glowPhase * 2 + index) * 0.3) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Check proximity for visual feedback
  const dist = Math.abs(dot.my - dot.correctMy);
  let dotColor = '#f97316';
  let borderColor = '#ea580c';

  if (dot.locked) {
    dotColor = '#34d399';
    borderColor = '#059669';
  } else if (dist < 0.15) {
    dotColor = '#fbbf24';
    borderColor = '#d97706';
  } else if (dist < 0.3) {
    dotColor = '#f59e0b';
  }

  // Shadow
  ctx.beginPath();
  ctx.arc(pos.x + 2, pos.y + 2, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Main circle
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = dotColor;
  ctx.fill();
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Inner highlight
  ctx.beginPath();
  ctx.arc(pos.x - 3, pos.y - 3, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fill();

  // Label
  ctx.fillStyle = 'white';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText((index + 1).toString(), pos.x, pos.y);
  ctx.textBaseline = 'alphabetic';
}

function drawParticles() {
  state.particles = state.particles.filter(p => p.life > 0);
  state.particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    p.vy += 0.1;
    if (p.life <= 0) return;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.life * 0.8})`;
    ctx.fill();
  });
}

function spawnParticles(x, y, count, r, g, b) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    state.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 2 + Math.random() * 3,
      life: 1,
      r, g, b
    });
  }
}

function drawConnectingLine() {
  if (state.lockedCount < 2) return;

  const lockedDots = state.dots.filter(d => d.locked);
  if (lockedDots.length < 2) return;

  // Sort by mx
  lockedDots.sort((a, b) => a.mx - b.mx);

  ctx.strokeStyle = 'rgba(52, 211, 153, 0.6)';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath();

  lockedDots.forEach((dot, i) => {
    const pos = m2c(dot.mx, dot.correctMy);
    if (i === 0) ctx.moveTo(pos.x, pos.y);
    else ctx.lineTo(pos.x, pos.y);
  });
  ctx.stroke();
}

function draw() {
  drawGrid();
  drawFunctionCurve();
  drawTargetMarkers();
  drawHintLines();
  drawConnectingLine();

  // Draw dots
  state.dots.forEach((dot, i) => drawDot(dot, i));

  drawParticles();

  // Draw "not started" overlay
  if (!state.running && !state.ended) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
    ctx.fillRect(0, 0, canvasW, canvasH);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎯 点击“启动”开始', canvasW / 2, canvasH / 2 - 10);

    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('拖动圆点到函数曲线上的正确位置', canvasW / 2, canvasH / 2 + 20);
  }

  // State indicator
  if (state.running && !state.ended) {
    const indicatorX = canvasW - 40;
    const indicatorY = 30;
    const color = state.paused ? '#fbbf24' : '#34d399';
    ctx.beginPath();
    ctx.arc(indicatorX, indicatorY, 8, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(state.paused ? '已暂停' : '进行中', indicatorX - 14, indicatorY + 4);
  }
}

function animationLoop() {
  state.glowPhase += 0.03;
  draw();
  state.animationId = requestAnimationFrame(animationLoop);
}

function updateProgress() {
  document.getElementById('progress-display').textContent = state.lockedCount + ' / ' + state.dots.length;
}

function updateStateDisplay() {
  const el = document.getElementById('state-display');
  if (state.ended) el.textContent = '✅ 完成';
  else if (state.paused) el.textContent = '⏸ 已暂停';
  else if (state.running) el.textContent = '▶ 进行中';
  else el.textContent = '等待中';
}

function handleMainBtn() {
  if (state.ended) {
    resetSimulation();
    startSimulation();
    return;
  }

  if (!state.running) {
    if (state.dots.length === 0) initDots();
    startSimulation();
  } else if (!state.paused) {
    pauseSimulation();
  } else {
    resumeSimulation();
  }
}

function startSimulation() {
  state.running = true;
  state.paused = false;
  state.ended = false;
  document.getElementById('main-btn').textContent = '暂停';
  document.getElementById('main-btn').classList.remove('ended');
  document.getElementById('message-overlay').classList.remove('show');
  updateStateDisplay();
  initDots();
  draw();
}

function pauseSimulation() {
  state.paused = true;
  document.getElementById('main-btn').textContent = '继续';
  updateStateDisplay();
  draw();
}

function resumeSimulation() {
  state.paused = false;
  document.getElementById('main-btn').textContent = '暂停';
  updateStateDisplay();
}

function resetSimulation() {
  if (state.animationId) cancelAnimationFrame(state.animationId);
  state.running = false;
  state.paused = false;
  state.ended = false;
  state.dragging = null;
  state.lockedCount = 0;
  state.dots = [];
  state.particles = [];
  state.glowPhase = 0;

  document.getElementById('main-btn').textContent = '启动';
  document.getElementById('main-btn').classList.remove('ended');
  document.getElementById('message-overlay').classList.remove('show');
  document.getElementById('instructions').style.display = '';
  document.getElementById('instructions').textContent = '点击“启动”后，拖动橙色圆点到正确的高度。横纵轴按各自刻度显示。';
  updateCoordinateSystem();

  updateStateDisplay();
  updateProgress();
  draw();
}

function checkLock(dot) {
  const dist = Math.abs(dot.my - dot.correctMy);
  const threshold = config.snapTolerance / scaleY;

  if (dist < threshold && !dot.locked) {
    dot.locked = true;
    dot.my = dot.correctMy;
    state.lockedCount++;
    updateProgress();

    // Particles!
    const pos = m2c(dot.mx, dot.correctMy);
    spawnParticles(pos.x, pos.y, 20, 52, 211, 153);

    // Check if all locked
    if (state.lockedCount === state.dots.length) {
      onSimulationComplete();
    }
  }
}

function onSimulationComplete() {
  state.ended = true;
  state.running = false;

  document.getElementById('main-btn').textContent = '重新开始';
  document.getElementById('main-btn').classList.add('ended');
  document.getElementById('instructions').textContent = '🎉 全部完成！点击“重新开始”再试一次';

  // Big celebration particles
  state.dots.forEach(dot => {
    const pos = m2c(dot.mx, dot.correctMy);
    spawnParticles(pos.x, pos.y, 15, 52, 211, 153);
  });

  // Show message
  const overlay = document.getElementById('message-overlay');
  document.getElementById('msg-title').textContent = '🎉 太棒了！';
  document.getElementById('msg-text').textContent = '所有 ' + state.dots.length + ' 个点都已正确放置！你理解了函数图像就是由无数个点组成的！';
  overlay.classList.add('show');

  updateStateDisplay();
  draw();
}

// Touch/mouse handling
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function findDotAt(pos) {
  let nearest=null, best=20*20;
  for(const dot of state.dots){
    if(dot.locked)continue;
    const p=m2c(dot.mx,dot.my),d=(pos.x-p.x)**2+(pos.y-p.y)**2;
    if(d<best){nearest=dot;best=d;}
  }
  return nearest;
}

function onPointerDown(e) {
  if (!state.running || state.paused || state.ended) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  const dot = findDotAt(pos);
  if (dot) {
    state.dragging = dot;
    canvas.style.cursor = 'grabbing';
  }
}

function onPointerMove(e) {
  if (!state.dragging || state.paused) return;
  e.preventDefault();
  const pos = getCanvasPos(e);
  const fn = functions[state.functionType];
  const mathPos = c2m(pos.x, pos.y);

  // Clamp x to the dot's mx
  state.dragging.my = Math.max(fn.yRange[0], Math.min(fn.yRange[1], mathPos.y));

  draw();
}

function onPointerUp(e) {
  if (!state.dragging) return;
  e.preventDefault();
  checkLock(state.dragging);
  state.dragging = null;
  canvas.style.cursor = 'default';
  draw();
}

canvas.addEventListener('mousedown', onPointerDown);
canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('mouseleave', onPointerUp);
canvas.addEventListener('touchstart', onPointerDown, { passive: false });
canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });

// Hover cursor
canvas.addEventListener('mousemove', (e) => {
  if (!state.running || state.paused || state.ended) return;
  const pos = getCanvasPos(e);
  const dot = findDotAt(pos);
  canvas.style.cursor = dot ? 'grab' : 'default';
});

// Slider changes
function onSliderChange(name, value) {
  value = parseFloat(value);
  if (name === 'num_dots') {
    config.numDots = Math.round(value);
    document.getElementById('num_dots-display').textContent = config.numDots;
  } else if (name === 'snap_tolerance') {
    config.snapTolerance = value;
    document.getElementById('snap_tolerance-display').textContent = value;
  } else if (name === 'show_hints') {
    config.showHints = value;
    document.getElementById('show_hints-display').textContent = value ? '是' : '否';
  }
  draw();
}

// Presets
function applyPreset(type, btnEl) {
  state.functionType = type;
  const fn = functions[type];
  document.getElementById('func-display').textContent = fn.label;

  // Update active preset button
  document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');

  // Update config based on preset
  const configMap = {
    linear: { numDots: 5, snapTolerance: 50, showHints: 1 },
    quadratic: { numDots: 6, snapTolerance: 40, showHints: 1 },
    sine: { numDots: 8, snapTolerance: 30, showHints: 0 },
    cubic: { numDots: 7, snapTolerance: 25, showHints: 0 }
  };

  const preset = configMap[type] || configMap.linear;
  config.numDots = preset.numDots;
  config.snapTolerance = preset.snapTolerance;
  config.showHints = preset.showHints;

  // Update sliders
  document.getElementById('num_dots-slider').value = preset.numDots;
  document.getElementById('num_dots-display').textContent = preset.numDots;
  document.getElementById('snap_tolerance-slider').value = preset.snapTolerance;
  document.getElementById('snap_tolerance-display').textContent = preset.snapTolerance;
  document.getElementById('show_hints-slider').value = preset.showHints;
  document.getElementById('show_hints-display').textContent = preset.showHints ? '是' : '否';

  resetSimulation();
}

// Keyboard shortcuts
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    handleMainBtn();
  } else if (e.code === 'KeyR') {
    resetSimulation();
  }
});

// Resize
window.addEventListener('resize', () => {
  resizeCanvas();
});

// postMessage listener
window.addEventListener('message', function(event) {
  const { type, target, state: msgState, content } = event.data || {};

  switch (type) {
    case 'SET_WIDGET_STATE':
      if (msgState) {
        Object.entries(msgState).forEach(([key, value]) => {
          const slider = document.getElementById(key + '-slider') || document.querySelector('[data-var="' + key + '"]');
          if (slider) {
            slider.value = value;
            slider.dispatchEvent(new Event('input', { bubbles: true }));
          }
        });
      }
      break;

    case 'HIGHLIGHT_ELEMENT':
      const highlightEl = document.querySelector(target);
      if (highlightEl) {
        highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
        highlightEl.style.outlineOffset = '4px';
        highlightEl.style.animation = 'pulse-highlight 2s infinite';
        setTimeout(() => {
          highlightEl.style.outline = '';
          highlightEl.style.animation = '';
        }, 3000);
      }
      break;

    case 'ANNOTATE_ELEMENT':
      const annotateEl = document.querySelector(target);
      if (annotateEl && content) {
        const rect = annotateEl.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'teacher-annotation';
        tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s; pointer-events:none;';
        tooltip.textContent = content;
        document.body.appendChild(tooltip);
        setTimeout(() => tooltip.remove(), 4000);
      }
      break;

    case 'REVEAL_ELEMENT':
      const revealEl = document.querySelector(target);
      if (revealEl) {
        revealEl.style.display = '';
        revealEl.style.opacity = '1';
      }
      break;
  }
});

// Add animation styles
const style = document.createElement('style');
style.textContent = '@keyframes pulse-highlight { 0%, 100% { outline-color: rgba(139, 92, 246, 0.8); } 50% { outline-color: rgba(139, 92, 246, 0.4); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);

new ResizeObserver(resizeCanvas).observe(container);

// Init
document.getElementById('func-display').textContent = functions.linear.label;
resizeCanvas();
animationLoop();
</script>
