<script>
(function(){
 'use strict';
 window.CQSimulationState={
  number:(value,fallback,min=-1e6,max=1e6)=>typeof value==='number'&&Number.isFinite(value)&&value>=min&&value<=max?value:fallback,
  install(scope,hooks){
   window.CQSimulationProgress={get:()=>({version:'simulation-ui-r12-v1',scope,state:hooks.get()}),set:saved=>{
    if(saved?.version!=='simulation-ui-r12-v1'||saved.scope!==scope||!saved.state||typeof saved.state!=='object'||Array.isArray(saved.state))return;
    const restoring=window.__cqRestoringProgress;window.__cqRestoringProgress=true;
    try{hooks.set(saved.state);}finally{window.__cqRestoringProgress=restoring;}
   }};
   window.dispatchEvent(new Event('cq:progress-ready'));
  }
 };
})();

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvas-container');

// State
let state = {
  running: false,
  paused: false,
  ended: false,
  functionType: 'linear',
  dots: [],
  dragging: null,
  lockedCount: 0,
  animationId: null,
  glowPhase: 0,
  particles: []
};

// Config
let config = {
  numDots: 6,
  snapTolerance: 35,
  showHints: 1
};

// Coordinate system
let origin = { x: 0, y: 0 };
let scaleX = 60, scaleY = 60;
let canvasW = 0, canvasH = 0;

// Function definitions
const functions = {
  linear: {
    fn: (x) => 2 * x + 1,
    label: 'y = 2x + 1',
    xRange: [-2, 3],
    yRange: [-3, 8]
  },
  quadratic: {
    fn: (x) => x * x,
    label: 'y = x²',
    xRange: [-3, 3],
    yRange: [-1, 10]
  },
  sine: {
    fn: (x) => Math.sin(x),
    label: 'y = sin(x)',
    xRange: [-Math.PI, Math.PI],
    yRange: [-2, 2]
  },
  cubic: {
    fn: (x) => Math.pow(x, 3) / 5,
    label: 'y = x³/5',
    xRange: [-3, 3],
    yRange: [-5, 5]
  }
};

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  if (ctx) if (ctx) ctx.setTransform(window.devicePixelRatio, 0, 0, window.devicePixelRatio, 0, 0);
  canvasW = rect.width;
  canvasH = rect.height;
  updateCoordinateSystem();
  draw();
}

function updateCoordinateSystem() {
  const fn = functions[state.functionType];
  scaleX = Math.max(1, canvasW - 100) / (fn.xRange[1] - fn.xRange[0]);
  scaleY = Math.max(1, canvasH - 120) / (fn.yRange[1] - fn.yRange[0]);
}
function m2c(mx, my) {
  const fn = functions[state.functionType];
  return {x: canvasW / 2 + (mx - (fn.xRange[0] + fn.xRange[1]) / 2) * scaleX,
    y: canvasH / 2 - (my - (fn.yRange[0] + fn.yRange[1]) / 2) * scaleY};
}
function c2m(cx, cy) {
  const fn = functions[state.functionType];
  return {x: (cx - canvasW / 2) / scaleX + (fn.xRange[0] + fn.xRange[1]) / 2,
    y: -(cy - canvasH / 2) / scaleY + (fn.yRange[0] + fn.yRange[1]) / 2};
}
function mathToCanvas(mx,my) {return m2c(mx,my);}
function canvasToMath(cx,cy) {return c2m(cx,cy);}
function recalcCoords() {updateCoordinateSystem();}

function initDots() {
  const fn = functions[state.functionType];
  const numDots = config.numDots;
  const xMin = fn.xRange[0], xMax = fn.xRange[1];
  state.dots = [];
  state.lockedCount = 0;

  for (let i = 0; i < numDots; i++) {
    const t = numDots === 1 ? 0.5 : i / (numDots - 1);
    const mx = xMin + t * (xMax - xMin);
    const correctMy = fn.fn(mx);
    const canvasPos = m2c(mx, correctMy);

    state.dots.push({
      mx: mx,
      my: 0, // Start at y=0
      correctMy: correctMy,
      locked: false,
      glowIntensity: 0,
      canvasX: canvasPos.x,
      canvasY: canvasPos.y,
      color: '#f97316'
    });
  }
  updateProgress();
}

function drawGrid() {
  const fn = functions[state.functionType];

  // Background
  ctx.fillStyle = '#0f172a';
  ctx.fillRect(0, 0, canvasW, canvasH);

  // Subtle grid
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1;

  const xMin = fn.xRange[0], xMax = fn.xRange[1];
  const yMin = fn.yRange[0], yMax = fn.yRange[1];

  // Vertical grid lines
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    const pos = m2c(x, 0);
    ctx.beginPath();
    ctx.moveTo(pos.x, 20);
    ctx.lineTo(pos.x, canvasH - 20);
    ctx.stroke();
  }

  // Horizontal grid lines
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    const pos = m2c(0, y);
    ctx.beginPath();
    ctx.moveTo(20, pos.y);
    ctx.lineTo(canvasW - 20, pos.y);
    ctx.stroke();
  }

  // Axes
  const originPos = m2c(0, 0);
  ctx.strokeStyle = '#475569';
  ctx.lineWidth = 2;

  // X-axis
  ctx.beginPath();
  ctx.moveTo(10, originPos.y);
  ctx.lineTo(canvasW - 10, originPos.y);
  ctx.stroke();

  // Y-axis
  ctx.beginPath();
  ctx.moveTo(originPos.x, 10);
  ctx.lineTo(originPos.x, canvasH - 10);
  ctx.stroke();

  // Axis labels
  ctx.fillStyle = '#64748b';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';

  // X-axis numbers
  for (let x = Math.ceil(xMin); x <= Math.floor(xMax); x++) {
    if (x === 0) continue;
    const pos = m2c(x, 0);
    ctx.fillText(x.toString(), pos.x, originPos.y + 18);
  }

  // Y-axis numbers
  ctx.textAlign = 'right';
  for (let y = Math.ceil(yMin); y <= Math.floor(yMax); y++) {
    if (y === 0) continue;
    const pos = m2c(0, y);
    ctx.fillText(y.toString(), originPos.x - 8, pos.y + 4);
  }

  // Origin label
  ctx.textAlign = 'center';
  ctx.fillText('O', originPos.x - 10, originPos.y + 16);

  // Axis names
  ctx.fillStyle = '#94a3b8';
  ctx.font = 'bold 14px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('x', canvasW - 20, originPos.y - 10);
  ctx.save();
  ctx.translate(originPos.x + 15, 20);
  ctx.fillText('y', 0, 0);
  ctx.restore();
}

function drawFunctionCurve() {
  const fn = functions[state.functionType];
  const xMin = fn.xRange[0], xMax = fn.xRange[1];

  ctx.strokeStyle = 'rgba(167, 139, 250, 0.25)';
  ctx.lineWidth = 3;
  ctx.setLineDash([8, 6]);
  ctx.beginPath();

  let started = false;
  for (let px = 0; px <= canvasW; px += 2) {
    const math = c2m(px, canvasH / 2);
    const y = fn.fn(math.x);
    const pos = m2c(math.x, y);
    if (!started) {
      ctx.moveTo(pos.x, pos.y);
      started = true;
    } else {
      ctx.lineTo(pos.x, pos.y);
    }
  }
  ctx.stroke();
  ctx.setLineDash([]);
}

function drawTargetMarkers() {
  if (!state.running || state.ended) return;

  state.dots.forEach((dot, i) => {
    if (dot.locked) return;

    const correctPos = m2c(dot.mx, dot.correctMy);

    // Vertical dashed line from x-axis to correct y
    const xAxPos = m2c(dot.mx, 0);
    ctx.strokeStyle = 'rgba(249, 115, 22, 0.2)';
    ctx.lineWidth = 1;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(xAxPos.x, xAxPos.y);
    ctx.lineTo(correctPos.x, correctPos.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Correct position indicator (small circle)
    ctx.beginPath();
    ctx.arc(correctPos.x, correctPos.y, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(52, 211, 153, 0.3)';
    ctx.fill();

    // X label
    ctx.fillStyle = 'rgba(249, 115, 22, 0.5)';
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    const spacing = Math.max(1,(canvasW-100)/Math.max(1,state.dots.length-1));
    const rows = Math.max(1,Math.ceil(ctx.measureText('x=-3.0').width / spacing));
    ctx.fillText('x=' + dot.mx.toFixed(1), xAxPos.x, xAxPos.y + 22 + (i % rows) * 14);
  });
}

function drawHintLines() {
  if (!config.showHints || !state.running || state.ended) return;

  state.dots.forEach(dot => {
    if (dot.locked) return;
    const correctPos = m2c(dot.mx, dot.correctMy);
    const dotPos = m2c(dot.mx, dot.my);

    // Distance indicator
    const dy = Math.abs(correctPos.y - dotPos.y);
    if (dy > 5) {
      ctx.strokeStyle = `rgba(${dy > config.snapTolerance ? '239,68,68' : '52,211,153'}, 0.4)`;
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 3]);
      ctx.beginPath();
      ctx.moveTo(dotPos.x + 15, dotPos.y);
      ctx.lineTo(dotPos.x + 15, correctPos.y);
      ctx.stroke();
      ctx.setLineDash([]);

      // Arrow
      ctx.fillStyle = ctx.strokeStyle;
      ctx.beginPath();
      if (correctPos.y < dotPos.y) {
        ctx.moveTo(dotPos.x + 10, dotPos.y - 2);
        ctx.lineTo(dotPos.x + 15, dotPos.y - 8);
        ctx.lineTo(dotPos.x + 20, dotPos.y - 2);
      } else {
        ctx.moveTo(dotPos.x + 10, dotPos.y + 2);
        ctx.lineTo(dotPos.x + 15, dotPos.y + 8);
        ctx.lineTo(dotPos.x + 20, dotPos.y + 2);
      }
      ctx.fill();
    }
  });
}

function drawDot(dot, index) {
  const pos = m2c(dot.mx, dot.my);
  const radius = 12;

  // Update canvas positions
  dot.canvasX = pos.x;
  dot.canvasY = pos.y;

  // Glow effect for locked dots
  if (dot.locked) {
    dot.glowIntensity = Math.min(1, dot.glowIntensity + 0.05);
    const glowRadius = radius + 8 + Math.sin(state.glowPhase + index) * 4;

    const gradient = ctx.createRadialGradient(((Number.isFinite(Number(pos.x)) ? Number(pos.x) : 0)), ((Number.isFinite(Number(pos.y)) ? Number(pos.y) : 0)), Math.max(0, ((Number.isFinite(Number(radius)) ? Number(radius) : 0))), ((Number.isFinite(Number(pos.x)) ? Number(pos.x) : 0)), ((Number.isFinite(Number(pos.y)) ? Number(pos.y) : 0)), Math.max(1, ((Number.isFinite(Number(glowRadius)) ? Number(glowRadius) : 1))));
    gradient.addColorStop(0, 'rgba(52, 211, 153, 0.6)');
    gradient.addColorStop(0.5, 'rgba(52, 211, 153, 0.2)');
    gradient.addColorStop(1, 'rgba(52, 211, 153, 0)');
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, glowRadius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();

    // Ring animation
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, radius + 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(52, 211, 153, ' + (0.5 + Math.sin(state.glowPhase * 2 + index) * 0.3) + ')';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  // Check proximity for visual feedback
  const dist = Math.abs(dot.my - dot.correctMy);
  let dotColor = '#f97316';
  let borderColor = '#ea580c';

  if (dot.locked) {
    dotColor = '#34d399';
    borderColor = '#059669';
  } else if (dist < 0.15) {
    dotColor = '#fbbf24';
    borderColor = '#d97706';
  } else if (dist < 0.3) {
    dotColor = '#f59e0b';
  }

  // Shadow
  ctx.beginPath();
  ctx.arc(pos.x + 2, pos.y + 2, radius, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fill();

  // Main circle
  ctx.beginPath();
  ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
  ctx.fillStyle = dotColor;
  ctx.fill();
  ctx.strokeStyle = borderColor;
  ctx.lineWidth = 2.5;
  ctx.stroke();

  // Inner highlight
  ctx.beginPath();
  ctx.arc(pos.x - 3, pos.y - 3, 4, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.fill();

  // Label
  ctx.fillStyle = 'white';
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText((index + 1).toString(), pos.x, pos.y);
  ctx.textBaseline = 'alphabetic';
}

function drawParticles() {
  state.particles = state.particles.filter(p => p.life > 0);
  state.particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;
    p.vy += 0.1;
    if (p.life <= 0) return;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${p.r}, ${p.g}, ${p.b}, ${p.life * 0.8})`;
    ctx.fill();
  });
}

function spawnParticles(x, y, count, r, g, b) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 3;
    state.particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: 2 + Math.random() * 3,
      life: 1,
      r, g, b
    });
  }
}

function drawConnectingLine() {
  if (state.lockedCount < 2) return;

  const lockedDots = state.dots.filter(d => d.locked);
  if (lockedDots.length < 2) return;

  // Sort by mx
  lockedDots.sort((a, b) => a.mx - b.mx);

  ctx.strokeStyle = 'rgba(52, 211, 153, 0.6)';
  ctx.lineWidth = 3;
  ctx.setLineDash([]);
  ctx.beginPath();

  lockedDots.forEach((dot, i) => {
    const pos = m2c(dot.mx, dot.correctMy);
    if (i === 0) ctx.moveTo(pos.x, pos.y);
    else ctx.lineTo(pos.x, pos.y);
  });
  ctx.stroke();
}

function draw() {
  drawGrid();
  drawFunctionCurve();
  drawTargetMarkers();
  drawHintLines();
  drawConnectingLine();

  // Draw dots
  state.dots.forEach((dot, i) => drawDot(dot, i));

  drawParticles();

  // Draw "not started" overlay
  if (!state.running && !state.ended) {
    ctx.fillStyle = 'rgba(15, 23, 42, 0.6)';
    ctx.fillRect(0, 0, canvasW, canvasH);

    ctx.fillStyle = '#e2e8f0';
    ctx.font = 'bold 20px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('🎯 点击“启动”开始', canvasW / 2, canvasH / 2 - 10);

    ctx.font = '14px sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('拖动圆点到函数曲线上的正确位置', canvasW / 2, canvasH / 2 + 20);
  }

  // State indicator
  if (state.running && !state.ended) {
    const indicatorX = canvasW - 40;
    const indicatorY = 30;
    const color = state.paused ? '#fbbf24' : '#34d399';
    ctx.beginPath();
    ctx.arc(indicatorX, indicatorY, 8, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '11px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(state.paused ? '已暂停' : '进行中', indicatorX - 14, indicatorY + 4);
  }
}

function animationLoop() {
  state.glowPhase += 0.03;
  draw();
  state.animationId = requestAnimationFrame(animationLoop);
}

function updateProgress() {
  document.getElementById('progress-display').textContent = state.lockedCount + ' / ' + state.dots.length;
}

function updateStateDisplay() {
  const el = document.getElementById('state-display');
  if (state.ended) el.textContent = '✅ 完成';
  else if (state.paused) el.textContent = '⏸ 已暂停';
  else if (state.running) el.textContent = '▶ 进行中';
  else el.textContent = '等待中';
}

function handleMainBtn() {
  if (state.ended) {
    resetSimulation();
    startSimulation();
    return;
  }

  if (!state.running) {
    if (state.dots.length === 0) initDots();
    startSimulation();
  } else if (!state.paused) {
    pauseSimulation();
  } else {
    resumeSimulation();
  }
}

function startSimulation() {
  state.running = true;
  state.paused = false;
  state.ended = false;
  document.getElementById('main-btn').textContent = '暂停';
  document.getElementById('main-btn').classList.remove('ended');
  document.getElementById('message-overlay').classList.remove('show');
  updateStateDisplay();
  initDots();
  draw();
}

function pauseSimulation() {
  state.paused = true;
  document.getElementById('main-btn').textContent = '继续';
  updateStateDisplay();
  draw();
}

function resumeSimulation() {
  state.paused = false;
  document.getElementById('main-btn').textContent = '暂停';
  updateStateDisplay();
}

function resetSimulation() {
  if (state.animationId) cancelAnimationFrame(state.animationId);
  state.running = false;
  state.paused = false;
  state.ended = false;
  state.dragging = null;
  state.lockedCount = 0;
  state.dots = [];
  state.particles = [];
  state.glowPhase = 0;

  document.getElementById('main-btn').textContent = '启动';
  document.getElementById('main-btn').classList.remove('ended');
  document.getElementById('message-overlay').classList.remove('show');
  document.getElementById('instructions').style.display = '';
  document.getElementById('instructions').textContent = '点击“启动”后，拖动橙色圆点到正确的高度。横纵轴按各自刻度显示。';
  updateCoordinateSystem();

  updateStateDisplay();
  updateProgress();
  draw();
}

function checkLock(dot) {
  const dist = Math.abs(dot.my - dot.correctMy);
  const threshold = config.snapTolerance / scaleY;

  if (dist < threshold && !dot.locked) {
    dot.locked = true;
    dot.my = dot.correctMy;
    state.lockedCount++;
    updateProgress();

    // Particles!
    const pos = m2c(dot.mx, dot.correctMy);
    spawnParticles(pos.x, pos.y, 20, 52, 211, 153);

    // Check if all locked
    if (state.lockedCount === state.dots.length) {
      onSimulationComplete();
    }
  }
}

function onSimulationComplete() {
  state.ended = true;
  state.running = false;

  document.getElementById('main-btn').textContent = '重新开始';
  document.getElementById('main-btn').classList.add('ended');
  document.getElementById('instructions').textContent = '🎉 全部完成！点击“重新开始”再试一次';

  state.dots.forEach(dot => {

    spawnParticles(pos.x, pos.y, 15, 52, 211, 153);

  const overlay = document.getElementById('message-overlay');
  document.getElementById('msg-title').textContent = '🎉 太棒了！';
  document.getElementById('msg-text').textContent = '所有 ' + state.dots.length + ' 个点都已正确放置！你理解了函数图像就是由无数个点组成的！';

  updateStateDisplay();
  draw();

// Touch/mouse handling
function getCanvasPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.touches) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

function findDotAt(pos) {

}

function onPointerUp(e) {
  if (!state.dragging) return;
  e.preventDefault();
  checkLock(state.dragging);
  state.dragging = null;
  canvas.style.cursor = 'default';
  draw();
}

canvas.addEventListener('mousemove', onPointerMove);
canvas.addEventListener('mouseup', onPointerUp);
canvas.addEventListener('mouseleave', onPointerUp);

canvas.addEventListener('touchmove', onPointerMove, { passive: false });
canvas.addEventListener('touchend', onPointerUp, { passive: false });

canvas.addEventListener('mousemove', (e) => {

(function(root,factory){const api=factory();if(typeof module==='object')module.exports=api;else root.R10Lessons=api;})(typeof window==='undefined'?globalThis:window,function(){
 'use strict';
 const lessons=[
 {id:'GH-01-K01',title:'输入、输出和函数规则',minutes:8,
  goal:'说明允许输入与实际输出，核对同一输入的输出唯一性，并区分已知规则与有限样本猜测。',
  core:'定义域是允许输入的集合，值域是按规则实际得到的输出集合。f表示整条函数规则，f(x)表示这次输入的输出。固定规则后，每个允许输入恰有一个输出；不同输入可以同值。',
  example:{title:'先确定范围，再检查对应',setup:'f(x)=x²，允许−2≤x≤2。',steps:['输入−2和2都得到4，输入0得到0。相同输出不违反函数要求。','每个允许输入按平方规则只有一个结果；实际输出从0到4，所以值域是[0,4]。','如果把定义域换成全部实数，规则表达式没变，函数的输入范围和值域都变了。'],conclusion:'判断一个函数，必须同时看定义域和对应规则。'},
  extension:{title:'多条公式也可以给出唯一输出',setup:'0≤x≤1时y=x+2；1≤x≤3时y=2x+1。',steps:['边界x=1同时适用两条公式，但两式都得到3。','其余允许输入各适用一条规则，所以仍然是函数。','若第二条改为y=2x+2，x=1就同时得到3和4，必须修改边界或规则。'],conclusion:'同一输入有几条适用公式不是关键；它们最终是否给出同一个输出才是关键。'},
  caution:'若只知道两个观测点，不能认定所有输入都遵从一条直线；先明确“一次函数模型”这一假设，两个不同输入才足以确定该模型。',
  transfer:'比较几条记录时，先说清“已给定规则”还是“正在猜规则”。后者需要更多假设和新数据检验。',refs:['CN-TJ-1.1','CN-SC-1.1','CN-SCZ-1.1']},
 {id:'GH-01-K02',title:'坐标点与函数图像',minutes:9,
  goal:'按刻度读取坐标，用规则核对图像点，保留化简前的定义域，区分空点与实际点值。',
  core:'有序对(x,y)先写输入再写输出。点属于y=f(x)的图像，需要x在定义域中，而且y=f(x)。空心点表示那个位置不取该值，实心点表示实际点值；图像上的空圈只是标记，不是删除一整段邻域。',
  example:{title:'化简没有给原式补一个点',setup:'g(x)=(x²−9)/(x−3)，定义域为x≠3。',steps:['先因式分解：x²−9=(x−3)(x+3)。','仅在x≠3时约去x−3，得到g(x)=x+3。','原函数在x=3处仍无定义；图像是直线y=x+3去掉(3,6)，这里画空心点。'],conclusion:'“附近公式相同”不等于“原函数在所有输入上都相同”。'},
  extension:{title:'限制定义域、补点与单独赋值',setup:'对比q(x)=x+3（全实数）与原g；原g在3处无定义。',steps:['原g与q在x≠3处同值，但定义域不同，所以不是同一个函数。','把q限制为x≠3，或把g补成g(3)=6，都能让两者成为同一个函数。','另设h在3处取1、其他位置按x+3计算，应在(3,6)画空点，在(3,1)画实点。'],conclusion:'补点后画哪一个实心点，以新定义为准；化简本身不负责补点。'},
  caution:'横轴和纵轴可以使用不同刻度。例如横轴每格1、纵轴每格2，右3格上2格表示(3,4)，不是(3,2)。',
  transfer:'若q(x)=x+3定义在全部实数上，它与原g不是同一个函数。可把q的定义域限制为x≠3，或给g补定义g(3)=6，使二者相同。若另补g(3)=1，则在(3,1)画实心点，(3,6)仍是空点。',refs:['CN-TJ-1.1','CN-SC-1.1','CN-SCZ-1.1']},
 {id:'GH-01-K03',title:'图像的上升、下降与变化方向',minutes:8,
  goal:'按输入顺序比较输出，区分样本判断与全区间判断，构造有效反例。',
  core:'严格上升是在选定区间内，对任意x₁<x₂都有f(x₁)<f(x₂)。严格下降则要求f(x₁)>f(x₂)。输出正负表示相对横轴的位置；增减表示有序输入对应的输出如何变化。',
  example:{title:'负输出也可以先增大再减小',setup:'输入0、1、2的输出依次为−4、−1、−3。',steps:['从输入0到1：−4<−1，样本输出增大。','从输入1到2：−1>−3，样本输出减小。','三个输出都是负数，但两次变化方向不同。'],conclusion:'要看输出之间的大小关系，不是只看它们是正数还是负数。'},
  extension:{title:'一个反例能说明多少',setup:'有人断言f(x)=x²在[−3,3]上严格上升。',steps:['取x₁=−2、x₂=−1，满足x₁<x₂。','f(−2)=4，而f(−1)=1；较大输入反而对应较小输出。','这一对已否定“整个区间严格上升”，但没有证明整个区间下降；0右侧的平方值仍在增大。'],conclusion:'反驳全称判断只需一个有效反例；证明全称判断需要覆盖整个区间的依据。'},
  caution:'连续也不保证单调。有限个上升的记录之间仍可能出现局部下降，不能把“屏幕中暂时没看到”当成“不存在”。',
  transfer:'比较两条模型曲线时，可以找一个区分性输入；如果旧样本全部相同，也不能直接宣布两条规则在所有输入上相同。',refs:['CN-TJ-1.1','CN-SC-1.1','CN-SCZ-1.2']},
 {id:'GH-02-K01',title:'从数表观察趋近',minutes:12,
  goal:'区分a、L与f(a)，从数表过渡到邻域规则，用误差关系给出对所有允许输入有效的范围。',
  core:'a是输入靠近的位置，L是附近输出趋近的数，f(a)是输入恰好为a时的输出。讨论x→a时看x≠a的邻近输入；L不由单点取值决定。数表提供线索，规则让我们说明未列出的邻近输入。',
  example:{title:'从倍率1到倍率3',setup:'x≠2时g(x)=3x+1，另设g(2)=0。要求附近输出与7的距离小于0.3。',steps:['附近规则给出L=7；点值g(2)=0另看。','|g(x)−7|=|3x+1−7|=3|x−2|：输出误差是输入误差的3倍。','取0<|x−2|<0.1，就有|g(x)−7|<0.3。取更小的正半径也有效，不必取最大半径。'],conclusion:'本例应将允许的输出误差除以3；不能照搬倍率1时“输入误差等于输出误差”的数值。'},
  extension:{title:'“足够近”需要保证所有输入',setup:'用ε表示给定的正输出误差，用δ表示待选的正输入范围半径。',steps:['先给ε>0，再根据规则选择δ>0；不是先固定一批测试点。','若附近f(x)=k(x−a)+L且k≠0，取0<δ≤ε/|k|，就能保证0<|x−a|<δ时，|f(x)−L|<ε。','k=0时附近输出恒为L，误差为0；任何仍落在该规则适用邻域内的正δ都有效。'],conclusion:'一次试点合格不是范围保证。这里的线性公式为邻域内全部允许输入提供了依据。'},
  caution:'x→∞是输入不断增大，和x→a不是同一种方向。例3+1/x在x→∞时趋近3，但有限正输入处不等于3。离散轮次n则是数列，不能只凭有限训练曲线宣布收敛。',
  transfer:'一个简化预测器ŷ=3x+1中，输入误差0.02会造成输出误差0.06。这里说明的是固定模型对输入扰动的反应，不是证明模型对新数据预测准确。',refs:['CN-TJ-1.3','CN-TJ-1.5','CN-SC-1.3','OS-2.5','GOOGLE-LOSS']},
 {id:'GH-02-K02',title:'图像上的左右极限',minutes:9,
  goal:'分别使用两侧规则，先检查各侧有限趋近，再比较共同值；区分跳跃、无界与不收敛。',
  core:'左极限使用小于a的邻近输入，右极限使用大于a的邻近输入。双侧有限极限存在，当且仅当两侧有限极限都存在且相等。该点的值和两侧平均值都不能代替共同极限。',
  example:{title:'先算两侧，再选拼接参数',setup:'x<1时f(x)=2x+k；x>1时f(x)=x+3；f(1)=9。',steps:['从左侧靠近1，2x+k趋近2+k。','从右侧靠近1，x+3趋近4。','要有共同有限极限，令2+k=4，得k=2。此时左右都趋近4，公式不必相同。'],conclusion:'只改f(1)不会改变k=2这个条件；共同极限为4，点值9另看。'},
  extension:{title:'“没有有限极限”有不同原因',setup:'把下面三种情形分开判断。',steps:['有限跳跃：左侧趋近1，右侧趋近3。两侧各自有有限极限，但不相等。','无界：1/x²在两侧靠近0时越来越大，没有有限上界；不能把正无穷当作一个有限实数。','不收敛：若两列都趋近0的正输入，其输出已由规则证明恒为1与−1，右侧不能趋近同一个数。'],conclusion:'结论“不存在”之后，还要说明有限性或相等性在哪一步失败。'},
  caution:'只给几行数表不能证明无界或振荡；必须结合完整规则，或已证明性质的趋近序列。',
  transfer:'分类例子：分数s(x)=x连续；规定x<0.5输出类别0，x≥0.5输出类别1。类别函数左右分别趋近0和1，存在跳变。阈值处归到哪类必须由规则明确。',refs:['CN-TJ-1.3','CN-SC-1.3','GOOGLE-THRESHOLD']},
 {id:'GH-02-K03',title:'连续就是不跳断',minutes:8,
  goal:'依次核对点值、共同有限极限与相等关系，在给定修改权限下决定能否修复。',
  core:'在定义域内点a处连续，需要f(a)有定义、双侧有限极限L存在，而且f(a)=L。点值缺失或不合适时，只有共同有限极限已经存在，才可以通过补点修复。端点只按定义域允许的一侧判断。',
  example:{title:'先判断能否修，再决定补什么',setup:'左侧趋近4，右侧趋近4，原点值为9；只允许改点值。',steps:['原点值有定义；左右都有共同有限极限4。','原点值9与极限4不同，所以原函数在该点不连续。','把点值改为4，三项条件同时满足；附近的规则无需改动。'],conclusion:'补点的值来自共同极限，不是随意选一个“看起来居中”的数。'},
  extension:{title:'跳跃不能补一个点解决，尖角却可以连续',setup:'对照两种容易混淆的图形。',steps:['左侧趋近4、右侧趋近5时，没有共同极限。无论把点值设在哪里，都不能同时等于4和5。','g(x)=|x|在0的左右极限都是0，g(0)=0，所以连续。','|x|有尖角但不间断；是否可导是后续课程中的另一个问题。'],conclusion:'连续、光滑与可导不能当成同一个概念。'},
  caution:'若允许改变邻域规则，可以先调参数让两侧趋近值一致，再令点值等于共同值。作答时要说明你使用了哪一种修改权限。',
