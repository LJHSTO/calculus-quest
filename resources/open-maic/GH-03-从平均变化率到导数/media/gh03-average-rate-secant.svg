<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">平均变化率与割线斜率</title>
  <desc id="desc">函数曲线上两点之间的蓝色割线，并标出横向变化量和纵向变化量。</desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#2c3e50"/>
    </marker>
    <marker id="measure-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5d6d7e"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="798" height="438" rx="14" fill="#ffffff" stroke="#dce5ea" stroke-width="2"/>
  <g font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif">
    <line x1="72" y1="372" x2="744" y2="372" stroke="#2c3e50" stroke-width="3" marker-end="url(#axis-arrow)"/>
    <line x1="92" y1="398" x2="92" y2="42" stroke="#2c3e50" stroke-width="3" marker-end="url(#axis-arrow)"/>
    <text x="750" y="384" font-size="25" fill="#2c3e50">x</text>
    <text x="73" y="42" font-size="25" fill="#2c3e50">y</text>

    <path d="M92 351 C178 300 260 300 344 270 C432 238 500 222 558 160 C608 107 634 70 650 38"
      fill="none" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
    <text x="602" y="72" font-size="25" font-style="italic" fill="#e74c3c">f(x)</text>

    <line x1="340" y1="270" x2="558" y2="160" stroke="#1877d2" stroke-width="5" stroke-linecap="round"/>
    <circle cx="340" cy="270" r="7" fill="#17202a"/>
    <circle cx="558" cy="160" r="7" fill="#17202a"/>
    <text x="214" y="254" font-size="23" fill="#2c3e50">f(x₁)</text>
    <text x="574" y="150" font-size="23" fill="#2c3e50">f(x₂)</text>

    <line x1="340" y1="270" x2="340" y2="338" stroke="#80919b" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="558" y1="160" x2="558" y2="338" stroke="#80919b" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="340" y1="329" x2="558" y2="329" stroke="#5d6d7e" stroke-width="3"
      marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
    <text x="430" y="360" font-size="23" fill="#5d6d7e">Δx</text>

    <line x1="602" y1="270" x2="602" y2="160" stroke="#5d6d7e" stroke-width="3"
      marker-start="url(#measure-arrow)" marker-end="url(#measure-arrow)"/>
    <line x1="558" y1="270" x2="602" y2="270" stroke="#80919b" stroke-width="2" stroke-dasharray="7 6"/>
    <line x1="558" y1="160" x2="602" y2="160" stroke="#80919b" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="617" y="224" font-size="23" fill="#5d6d7e">Δy</text>

    <g transform="translate(126 68)">
      <line x1="0" y1="0" x2="42" y2="0" stroke="#1877d2" stroke-width="5" stroke-linecap="round"/>
      <text x="54" y="8" font-size="20" fill="#42535d">割线</text>
      <line x1="142" y1="0" x2="184" y2="0" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
      <text x="196" y="8" font-size="20" fill="#42535d">函数曲线</text>
    </g>
  </g>
</svg>
