<script>

  const defaults = {};

  const controls = Object.fromEntries(CONFIG.controls.map((item) => [item[1], document.getElementById(item[1])]));
  const values = Object.fromEntries(CONFIG.controls.map((item) => [item[1], document.getElementById(item[1] + '-value')]));
  const familyNames = ['xⁿ', 'eˣ', 'ln x', 'sin x'];
  const familyFns = [
    (x) => Math.sign(x) * Math.pow(Math.abs(x), 2),
    (x) => Math.exp(x) / Math.E,
    (x) => Math.log(Math.max(0.08, x + 1.08)) / 2,
    (x) => Math.sin(x * Math.PI / 2),

  const derivativeFns = [
    (x) => 2 * x,
    (x) => Math.exp(x) / Math.E,
    (x) => 1 / Math.max(0.18, x + 1.08) / 2,
    (x) => Math.cos(x * Math.PI / 2) * Math.PI / 2,

  function value(id) { return Number(controls[id]?.value || defaults[id] || 0); }

  function size() { const rect = wrap.getBoundingClientRect(); return [Math.max(280, rect.width), Math.max(260, rect.height)]; }
  function project(point) {
    const [w, h] = size(); const [x, y, z] = point; const ca = Math.cos(state.azimuth); const sa = Math.sin(state.azimuth); const ce = Math.cos(state.elevation); const se = Math.sin(state.elevation);
    const xr = x * ca - y * sa; const yr = x * sa + y * ca; const yr2 = yr * ce - z * se; const depth = yr * se + z * ce; const perspective = 1 / (1 + depth * 0.08);

      window.dispatchEvent(new Event("resize"));
      internalResize = false;
      requestAnimationFrame(function () {
        if (
          active &&
          active.parent.isConnected &&
          active.panel.isConnected &&
          active.pane.isConnected &&
          active.canvas.isConnected
        ) {
          var layout = {
            parent: active.parent,
            panel: active.panel,
            pane: active.pane,
            canvas: active.canvas,
            overlay: active.overlay
          };
          if (layout.overlay) applyOverlayLayout(layout);
          else applyLayout(layout);
        }
        window.dispatchEvent(new CustomEvent("openmaic:courseware-layout"));
      });
    });
  }

  function refresh() {
    scheduled = false;
    var forced = forceRefresh;
    forceRefresh = false;
    var layout = findLayout() || findOverlayLayout();
    if (!layout) {
      if (active) {
        restoreActive();
        notifyCanvasResize();
      }
      repairFloatingControls();
      return;
    }
    if (
      active &&
      !forced &&
      active.parent === layout.parent &&
      active.panel === layout.panel &&
      active.pane === layout.pane
    ) return;
    if (layout.overlay) applyOverlayLayout(layout);
    else applyLayout(layout);
    repairFloatingControls();
    notifyCanvasResize();
  }

  function schedule(force) {
    if (internalResize || scheduled) return;
    if (force === true) forceRefresh = true;
    scheduled = true;
    requestAnimationFrame(refresh);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { schedule(true); }, { once: true });
  } else {
    schedule(true);
  }
  window.addEventListener("resize", function () { schedule(true); });
  document.addEventListener("fullscreenchange", function () { schedule(true); });
  document.addEventListener("click", function () {
    setTimeout(function () { schedule(true); }, 0);
    setTimeout(function () { schedule(true); }, 320);
  }, true);
})();
</script>

</body>
