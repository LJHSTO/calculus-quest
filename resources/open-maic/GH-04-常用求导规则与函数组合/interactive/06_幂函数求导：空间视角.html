<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>幂函数求导：系数、幂次与斜率空间</title>
<style>
:root{font-family:"Segoe UI Variable Text","Microsoft YaHei",sans-serif;color:#10211d;background:#f4f8f7}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{display:grid;grid-template-rows:auto 1fr;background:linear-gradient(135deg,#f8fbfb,#e8f3f0)}
header{padding:14px 18px;border-bottom:1px solid #cddbd7;background:rgba(255,255,255,.92)}h1{margin:0 0 4px;font-size:clamp(18px,3vw,30px);line-height:1.2}header p{margin:0;color:#526762;font-size:13px;line-height:1.45}
.app{min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;padding:14px}.stage,.panel{min-width:0;min-height:0;border:1px solid #cddbd7;border-radius:10px;background:#fff;box-shadow:0 10px 24px rgba(28,65,56,.08)}
.stage{display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden}.toolbar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid #d8e3e0}.toolbar button,.panel button{min-height:32px;padding:6px 10px;border:1px solid #b8cbc5;border-radius:6px;background:#fff;color:#1c5148;cursor:pointer;font-weight:650}.toolbar button:hover,.panel button:hover{border-color:#168978;background:#eff9f6}.toolbar button.active{background:#dff2ed;border-color:#168978}.toolbar button.primary{background:#14786f;color:#fff;border-color:#14786f}.canvas-wrap{position:relative;min-height:0;overflow:hidden;background:#f7fbfa}.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none}.fallback{position:absolute;inset:0;padding:18px;overflow:auto;background:#fff;color:#1c3832}.fallback[hidden]{display:none}.fallback h2{margin:0 0 8px;font-size:18px}.fallback p{margin:7px 0;line-height:1.5}.fallback .formula{padding:12px;border-left:3px solid #168978;background:#eaf7f3;font-family:Consolas,"Microsoft YaHei",monospace;font-size:16px}.status{padding:8px 12px;border-top:1px solid #d8e3e0;color:#315a51;font-size:12px;line-height:1.4}.panel{padding:12px;overflow:auto}.panel h2{margin:0 0 8px;font-size:16px}.panel .hint{margin:0 0 12px;color:#526762;font-size:12px;line-height:1.5}.controls{display:grid;gap:10px}.controls label{display:grid;grid-template-columns:1fr auto;gap:5px;align-items:center;color:#2c4d45;font-size:12px;font-weight:650}.controls input,.controls select{grid-column:1 / -1;width:100%;accent-color:#14786f}.controls output{font:12px Consolas,monospace;color:#14786f}.evidence{margin-top:14px;padding:10px;border-left:3px solid #d9822b;background:#fff6e5;font-size:12px;line-height:1.55}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.legend{display:grid;gap:5px;margin-top:12px;color:#526762;font-size:11px}.legend span{display:flex;align-items:center;gap:7px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.teal{background:#14786f}.orange{background:#d9822b}.blue{background:#476bd6}.red{background:#c64d4d}
@media(max-width:760px){body{overflow:auto;grid-template-rows:auto auto}.app{grid-template-columns:1fr;grid-template-rows:minmax(420px,62vh) auto}.panel{max-height:none}.stage{min-height:420px}}
</style>
</head>
<body>
<header><h1>幂函数求导：系数、幂次与斜率空间</h1><p>在参数曲面上同时改变系数 c 和幂次 n，观察 f(x)=cxⁿ 与 f′(x)=cnxⁿ⁻¹ 的斜率如何联动。</p></header>
<main class="app">
  <section class="stage" aria-label="空间视角画布">
    <div class="toolbar" role="toolbar" aria-label="空间视角工具">
      <button id="view-space" class="active" type="button">空间</button><button id="view-top" type="button">俯视</button><button id="view-side" type="button">侧视</button><button id="view-fallback" type="button">2D fallback</button><button id="reset" type="button">重置</button>
    </div>
    <div class="canvas-wrap"><canvas id="space-canvas" aria-label="可旋转的数学空间图"></canvas><div id="fallback" class="fallback" hidden></div></div>
    <div id="status" class="status" aria-live="polite">拖动滑块或直接拖动画布，观察变量变化如何改变导数证据。</div>
  </section>
  <aside class="panel">
    <h2>观察任务</h2><p class="hint">先改变一个变量，再说出哪个量发生了变化，最后用 2D fallback 核对公式。</p>
    <div class="controls"><label>系数 c<input id="coefficient" type="range" min="0.5" max="2" step="0.1" value="1"><output id="coefficient-value">1</output></label><label>幂次 n<input id="power" type="range" min="1" max="5" step="0.1" value="2"><output id="power-value">2</output></label><label>观察点 x<input id="point" type="range" min="-1" max="1" step="0.05" value="0.6"><output id="point-value">0.6</output></label></div>
    <div class="actions"><button id="animate" class="primary" type="button">播放变化</button><button id="stop" type="button">暂停</button></div>
    <div class="evidence"><strong>可观察证据</strong><br>2D fallback：上方显示函数曲线，下方显示导函数曲线，并同步标出当前 x 的斜率。</div>
    <div class="legend"><span><i class="dot teal"></i>函数或输入</span><span><i class="dot orange"></i>导数贡献</span><span><i class="dot blue"></i>合成结果</span><span><i class="dot red"></i>当前观察点</span></div>
  </aside>
</main>
<script>
(() => {
  'use strict';
  const CONFIG = {"file":"06_幂函数求导：空间视角.html","title":"幂函数求导：系数、幂次与斜率空间","concept":"幂函数与线性组合","kind":"power","description":"在参数曲面上同时改变系数 c 和幂次 n，观察 f(x)=cxⁿ 与 f′(x)=cnxⁿ⁻¹ 的斜率如何联动。","fallback":"2D fallback：上方显示函数曲线，下方显示导函数曲线，并同步标出当前 x 的斜率。","controls":[["系数 c","coefficient","range","0.5","2","0.1","1"],["幂次 n","power","range","1","5","0.1","2"],["观察点 x","point","range","-1","1","0.05","0.6"]]};
  const canvas = document.getElementById('space-canvas');
  const context = canvas.getContext('2d');
  const wrap = document.querySelector('.canvas-wrap');
  const fallback = document.getElementById('fallback');
  const status = document.getElementById('status');
  const state = { view: 'space', azimuth: -0.72, elevation: 0.58, zoom: 1, playing: false, frame: 0 };
  const defaults = {};
  CONFIG.controls.forEach((item) => { defaults[item[1]] = item[6]; });
  const controls = Object.fromEntries(CONFIG.controls.map((item) => [item[1], document.getElementById(item[1])]));
  const values = Object.fromEntries(CONFIG.controls.map((item) => [item[1], document.getElementById(item[1] + '-value')]));
  const familyNames = ['xⁿ', 'eˣ', 'ln x', 'sin x'];
  const familyFns = [
    (x) => Math.sign(x) * Math.pow(Math.abs(x), 2),
    (x) => Math.exp(x) / Math.E,
    (x) => Math.log(Math.max(0.08, x + 1.08)) / 2,
    (x) => Math.sin(x * Math.PI / 2),
  ];
  const derivativeFns = [
    (x) => 2 * x,
    (x) => Math.exp(x) / Math.E,
    (x) => 1 / Math.max(0.18, x + 1.08) / 2,
    (x) => Math.cos(x * Math.PI / 2) * Math.PI / 2,
  ];

  function value(id) { return Number(controls[id]?.value || defaults[id] || 0); }
  function format(id) { const n = value(id); return Number.isInteger(n) ? String(n) : n.toFixed(2); }
  function notify(kind, detail = {}) {
    window.parent?.postMessage({ __maicInteractive: true, kind, scene: CONFIG.kind, detail }, '*');
  }
  function resize() {
    const rect = wrap.getBoundingClientRect();
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.floor(rect.width * dpr));
    canvas.height = Math.max(1, Math.floor(rect.height * dpr));
    context.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }
  function size() { const rect = wrap.getBoundingClientRect(); return [Math.max(280, rect.width), Math.max(260, rect.height)]; }
  function project(point) {
    const [w, h] = size(); const [x, y, z] = point; const ca = Math.cos(state.azimuth); const sa = Math.sin(state.azimuth); const ce = Math.cos(state.elevation); const se = Math.sin(state.elevation);
    const xr = x * ca - y * sa; const yr = x * sa + y * ca; const yr2 = yr * ce - z * se; const depth = yr * se + z * ce; const perspective = 1 / (1 + depth * 0.08);
    const scale = Math.min(w, h) * 0.32 * state.zoom; return [w / 2 + xr * scale * perspective, h * 0.54 - yr2 * scale * perspective, depth];
  }
  function line(points, color, width = 1, dashed = false) {
    if (!points.length) return; context.save(); context.strokeStyle = color; context.lineWidth = width; context.setLineDash(dashed ? [5, 4] : []); context.beginPath(); points.forEach((p, i) => { const q = project(p); if (!i) context.moveTo(q[0], q[1]); else context.lineTo(q[0], q[1]); }); context.stroke(); context.restore();
  }
  function label(text, point, color = '#264b43') { const q = project(point); context.save(); context.fillStyle = color; context.font = '12px Microsoft YaHei, sans-serif'; context.fillText(text, q[0] + 6, q[1] - 6); context.restore(); }
  function axes() {
    line([[-1.3, 0, 0], [1.3, 0, 0]], '#14786f', 2); line([[0, -1.3, 0], [0, 1.3, 0]], '#d9822b', 2); line([[0, 0, -1.15], [0, 0, 1.15]], '#476bd6', 2);
    label(CONFIG.kind === 'chain' ? 'x / 输入' : '输入 x', [1.3, 0, 0], '#14786f'); label(CONFIG.kind === 'product' ? '输入 g' : '结构参数', [0, 1.3, 0], '#d9822b'); label('导数 / 变化率', [0, 0, 1.15], '#476bd6');
  }
  function grid() { for (let i = -1; i <= 1.001; i += .25) { line([[i, -1, -0.02], [i, 1, -0.02]], 'rgba(20,120,111,.14)'); line([[-1, i, -0.02], [1, i, -0.02]], 'rgba(20,120,111,.14)'); } }
  function surface(fn, color) {
    for (let ix = 0; ix < 10; ix += 1) for (let iy = 0; iy < 10; iy += 1) {
      const x0 = -1 + ix * .2; const y0 = -1 + iy * .2; const x1 = x0 + .2; const y1 = y0 + .2; const p = [[x0, y0, fn(x0, y0)], [x1, y0, fn(x1, y0)], [x1, y1, fn(x1, y1)], [x0, y1, fn(x0, y1)]];
      const projected = p.map(project); context.save(); context.fillStyle = color; context.globalAlpha = .38; context.beginPath(); projected.forEach((q, i) => { if (!i) context.moveTo(q[0], q[1]); else context.lineTo(q[0], q[1]); }); context.closePath(); context.fill(); context.restore();
    }
    for (let i = -1; i <= 1.001; i += .2) line(Array.from({ length: 11 }, (_, j) => { const t = -1 + j * .2; return [i, t, fn(i, t)]; }), color, 1);
  }
  function point(point, color, radius = 6) { const q = project(point); context.save(); context.fillStyle = color; context.beginPath(); context.arc(q[0], q[1], radius, 0, Math.PI * 2); context.fill(); context.restore(); }
  function drawPower() {
    const n = value('power'); const c = value('coefficient'); const x = value('point'); surface((u, v) => Math.max(-1, Math.min(1, c * Math.sign(u) * Math.pow(Math.abs(u), n) * (.75 + .1 * v))), 'rgba(20,120,111,.65)');
    line(Array.from({ length: 41 }, (_, i) => { const t = -1 + i / 20; return [t, .0, Math.max(-1, Math.min(1, c * Math.sign(t) * Math.pow(Math.abs(t), n)))]; }), '#14786f', 3); point([x, 0, Math.max(-1, Math.min(1, c * n * Math.sign(x) * Math.pow(Math.abs(x), Math.max(0, n - 1))))], '#c64d4d', 7); label('f′(x)=cnxⁿ⁻¹', [x, 0, .8], '#c64d4d');
  }
  function drawProduct() {
    const f = value('fixedF'); const g = value('fixedG'); const h = value('step'); surface((u, v) => u * v * .8, 'rgba(71,107,214,.7)'); line([[-1, g, -0.8], [1, g, .8]], '#14786f', 3); line([[f, -1, -0.8], [f, 1, .8]], '#d9822b', 3); point([f, g, f * g * .8], '#c64d4d', 7); label('f′g + fg′', [f, g, .9], '#c64d4d'); label('h=' + h.toFixed(2) + ' 的两个交叉贡献', [-.9, -.9, .9], '#d9822b');
  }
  function drawChain() {
    const a = value('innerSlope'); const n = value('outerPower'); const x = value('input'); const u = a * x; const y = Math.sign(u) * Math.pow(Math.abs(u), n); const total = n * Math.pow(Math.max(.1, Math.abs(u)), Math.max(0, n - 1)) * a;
    line([[-1, 0, 0], [1, 0, 0]], '#14786f', 3); line([[x, 0, 0], [x, .85, u * .55]], '#d9822b', 3); line([[x, .85, u * .55], [x, 1.2, y]], '#476bd6', 3); point([x, 0, 0], '#14786f'); point([x, .85, u * .55], '#d9822b'); point([x, 1.2, y], '#c64d4d', 7); label('x', [x, 0, 0]); label('u=f(x)', [x, .85, u * .55], '#d9822b'); label('y=g(u)', [x, 1.2, y], '#476bd6'); label('总导数=' + total.toFixed(2), [.15, .2, .9], '#c64d4d');
  }
  function drawSpeed() {
    const family = Math.round(value('family')); const x = value('input'); const range = value('range'); surface((u, v) => { const idx = Math.max(0, Math.min(3, Math.round((v + 1) * 1.5))); return Math.max(-1, Math.min(1, derivativeFns[idx](u * range))); }, 'rgba(71,107,214,.62)'); line(Array.from({ length: 41 }, (_, i) => { const t = -1 + i / 20; return [t, (family / 1.5) - 1, Math.max(-1, Math.min(1, derivativeFns[family](t * range) / 2))]; }), '#14786f', 3); point([x, family / 1.5 - 1, Math.max(-1, Math.min(1, derivativeFns[family](x * range) / 2))], '#c64d4d', 7); label(familyNames[family] + ' 的导数值', [x, family / 1.5 - 1, .85], '#c64d4d');
  }
  function drawFallback() {
    const [w, h] = size(); context.fillStyle = '#fff'; context.fillRect(0, 0, w, h); const left = 54; const top = 44; const width = w - 90; const height = h - 100; context.strokeStyle = '#bbd0c9'; context.lineWidth = 1; context.beginPath(); context.moveTo(left, top); context.lineTo(left, top + height); context.lineTo(left + width, top + height); context.stroke();
    context.fillStyle = '#264b43'; context.font = '14px Microsoft YaHei, sans-serif'; context.fillText('2D fallback · ' + CONFIG.concept, left, 22);
    if (CONFIG.kind === 'chain') { const boxes = [['x', '输入'], ['u=f(x)', '内层'], ['y=g(u)', '外层']]; boxes.forEach((b, i) => { const x = left + 30 + i * (width - 80) / 2; context.fillStyle = ['#eaf7f3', '#fff6e5', '#edf1ff'][i]; context.fillRect(x, top + height / 2 - 34, 100, 68); context.strokeStyle = '#9bbcb3'; context.strokeRect(x, top + height / 2 - 34, 100, 68); context.fillStyle = '#264b43'; context.fillText(b[0], x + 30, top + height / 2 - 4); context.font = '11px Microsoft YaHei, sans-serif'; context.fillText(b[1], x + 26, top + height / 2 + 18); context.font = '14px Microsoft YaHei, sans-serif'; if (i < 2) context.fillText('→', x + 112, top + height / 2 + 6); }); context.fillText('总导数 = 外层导数 × 内层导数', left, top + height - 12); return; }
    const family = CONFIG.kind === 'speed' ? Math.round(value('family')) : 0; const fn = CONFIG.kind === 'power' ? (x) => value('coefficient') * Math.sign(x) * Math.pow(Math.abs(x), value('power')) : CONFIG.kind === 'product' ? (x) => x * value('fixedG') : (x) => familyFns[family](x); const derivative = CONFIG.kind === 'power' ? (x) => value('coefficient') * value('power') * Math.sign(x) * Math.pow(Math.abs(x), Math.max(0, value('power') - 1)) : CONFIG.kind === 'product' ? () => value('fixedG') : (x) => derivativeFns[family](x * (CONFIG.kind === 'speed' ? value('range') : 1));
    function curve(fn2, color, dash) { context.save(); context.strokeStyle = color; context.lineWidth = 3; context.setLineDash(dash ? [6, 4] : []); context.beginPath(); for (let i = 0; i <= 100; i += 1) { const x = -1 + i / 50; const px = left + (x + 1) * width / 2; const py = top + height / 2 - Math.max(-1.2, Math.min(1.2, fn2(x))) * height / 2.4; if (!i) context.moveTo(px, py); else context.lineTo(px, py); } context.stroke(); context.restore(); }
    curve(fn, '#14786f', false); curve(derivative, '#d9822b', true); context.fillStyle = '#315a51'; context.font = '12px Microsoft YaHei, sans-serif'; context.fillText('函数', left + width - 42, top + 18); context.fillText('导函数', left + width - 58, top + 38); context.fillText('红色点：当前输入位置', left, top + height + 28);
  }
  function draw() { const [w, h] = size(); context.clearRect(0, 0, w, h); if (state.view === 'fallback') { drawFallback(); return; } context.fillStyle = '#f7fbfa'; context.fillRect(0, 0, w, h); grid(); axes(); if (CONFIG.kind === 'power') drawPower(); if (CONFIG.kind === 'product') drawProduct(); if (CONFIG.kind === 'chain') drawChain(); if (CONFIG.kind === 'speed') drawSpeed(); }
  function updateStatus() { let text = ''; if (CONFIG.kind === 'power') text = 'c=' + format('coefficient') + '，n=' + format('power') + '，x=' + format('point') + '：红点高度对应 f′(x)=cnxⁿ⁻¹。'; if (CONFIG.kind === 'product') text = 'f=' + format('fixedF') + '，g=' + format('fixedG') + '：曲面上的变化由 f′g 与 fg′ 两个交叉贡献组成。'; if (CONFIG.kind === 'chain') text = 'x=' + format('input') + '：先得到 u=f(x)，再乘上外层导数，总变化率沿 x→u→y 路径传递。'; if (CONFIG.kind === 'speed') text = familyNames[Math.round(value('family'))] + '：当前位置的导数读数为 ' + derivativeFns[Math.round(value('family'))](value('input') * value('range')).toFixed(2) + '。'; status.textContent = text; }
  function sync() { Object.entries(values).forEach(([id, output]) => { if (output) output.textContent = format(id); }); updateStatus(); draw(); notify('interaction', { view: state.view }); }
  function setView(view) { state.view = view; document.querySelectorAll('.toolbar button').forEach((button) => button.classList.toggle('active', button.id === 'view-' + view)); fallback.hidden = view !== 'fallback'; sync(); }
  Object.entries(controls).forEach(([id, control]) => control?.addEventListener('input', sync));
  document.getElementById('view-space').addEventListener('click', () => setView('space')); document.getElementById('view-top').addEventListener('click', () => { state.elevation = 1.45; setView('top'); }); document.getElementById('view-side').addEventListener('click', () => { state.elevation = .04; setView('side'); }); document.getElementById('view-fallback').addEventListener('click', () => setView('fallback'));
  document.getElementById('reset').addEventListener('click', () => { state.azimuth = -.72; state.elevation = .58; state.zoom = 1; Object.entries(defaults).forEach(([id, v]) => { if (controls[id]) controls[id].value = v; }); setView('space'); });
  document.getElementById('animate').addEventListener('click', () => { state.playing = true; notify('interaction', { action: 'play' }); }); document.getElementById('stop').addEventListener('click', () => { state.playing = false; notify('interaction', { action: 'pause' }); });
  let dragging = false; let lastX = 0; let lastY = 0; canvas.addEventListener('pointerdown', (event) => { dragging = true; lastX = event.clientX; lastY = event.clientY; canvas.setPointerCapture(event.pointerId); }); canvas.addEventListener('pointermove', (event) => { if (!dragging || state.view === 'fallback') return; state.azimuth += (event.clientX - lastX) * .01; state.elevation = Math.max(-.9, Math.min(1.5, state.elevation + (event.clientY - lastY) * .01)); lastX = event.clientX; lastY = event.clientY; draw(); }); canvas.addEventListener('pointerup', () => { dragging = false; }); canvas.addEventListener('wheel', (event) => { event.preventDefault(); state.zoom = Math.max(.6, Math.min(1.8, state.zoom - event.deltaY * .001)); draw(); }, { passive: false });
  function animate() { if (state.playing) { state.frame += 1; const id = CONFIG.kind === 'power' ? 'point' : CONFIG.kind === 'chain' || CONFIG.kind === 'speed' ? 'input' : 'step'; if (controls[id]) { const item = CONFIG.controls.find((control) => control[1] === id); const min = Number(item[3]); const max = Number(item[4]); const t = (Math.sin(state.frame / 30) + 1) / 2; controls[id].value = min + (max - min) * t; sync(); } } requestAnimationFrame(animate); }
  window.addEventListener('resize', resize); resize(); sync(); animate();
})();
</script>
</body>
</html>
