        :root {

            font-weight: bold;

        .point-grid {
            display: grid;

            gap: 15px;
            width: 100%;

        .point-card {
            background: #f8f9fa;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 15px;
            transition: all 0.3s;
        }

        .point-card.selected {
            border-color: var(--primary);
            background: #eef6ff;
        }

        .point-card.correct {
            border-color: var(--success);
            background: #f0fff4;
        }

        .point-card.wrong {
            border-color: var(--danger);

            font-size: 1.2rem;

            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 100%;
        }

        .toggle-btn {
            display: flex;
            gap: 5px;
        }

        .toggle-opt {
            flex: 1;
            padding: 8px;
            font-size: 0.85rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            cursor: pointer;
            background: white;
        }

        .toggle-opt.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Feedback Area */
        #feedback {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;

            border-radius: 12px;

            transition: all 0.2s;

        }

        .controls {

            border: none;

        }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .point-grid { grid-template-columns: 1fr; }
            .rule-display { font-size: 1.1rem; }
        }

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Game State
    let state = {
        score: 0,
        currentLevel: 0,
        points: [],
        selectedPointIdx: 0,
        hintUsed: false,
        reasoningChoice: null,
        config: JSON.parse(document.getElementById('widget-config').textContent)
    };

    // Global functions for inline onclick
    window.startGame = function() {
        showScreen('game-screen');
        initLevel(0);
    };

    window.resetGame = function() {
        showScreen("game-screen");
        state.score = 0;
        state.currentLevel = 0;
        state.hintUsed = false;
        state.reasoningChoice = null;
        updateScore(0);
        initLevel(0);
    };

    window.showHint = function() {
        state.hintUsed = true;
        const feedback = document.getElementById('feedback');
        feedback.innerHTML = "💡 提示：把横坐标代入规则，看看算出的结果和纵坐标是否一致。";
        feedback.style.display = 'block';
        feedback.className = 'feedback-success';
    };

    window.submitTask = function() {
        let allCorrect = true;
        let hasWrongPoint = false;

        state.points.forEach((p, idx) => {
            const calcVal = parseFloat(document.getElementById(`calc-${idx}`).value);
            const on=document.getElementById(`on-${idx}`);
            const hasChoice=on.classList.contains('active')||on.nextElementSibling.classList.contains('active');
            const isOnGraph = on.classList.contains('active'); if(!hasChoice) allCorrect=false;
            
            // Check calculation
            if (calcVal !== p.expectedY) {
                allCorrect = false;
                showFeedback(`计算错误：${p.ruleText} 代入 x=${p.x} 应该得到 ${p.expectedY}。`, 'error');
            }

            // Check membership
            if (isOnGraph !== p.correct) {
                allCorrect = false;
                if (p.correct) {
                    showFeedback(`判断错误：(${p.x}, ${p.expectedY}) 是在图像上的。`, 'error');
                } else {
                    showFeedback(`判断错误：(${p.x}, ${p.y}) 不在图像上，因为 ${p.ruleText} 代入 x=${p.x} 得到 ${p.expectedY}，不等于 ${p.y}。`, 'error');
                }
            }

            if (!p.correct) hasWrongPoint = true;
        });

        CQ.attempt(allCorrect,"坐标审核",{task:"audit",round:state.currentLevel,values:state.points.flatMap((p,i)=>{const input=document.getElementById(`calc-${i}`),on=document.getElementById(`on-${i}`);return [input.value===""?null:Number(input.value),on.classList.contains("active")?true:on.nextElementSibling.classList.contains("active")?false:null];})});
        if (allCorrect) {
            if(state.transitioning) return; state.transitioning=true; CQ.complete();
            updateScore(10);
            showFeedback("审核正确！所有点已验证。", "success");
            setTimeout(() => {
                if (state.currentLevel === 0) {
                    initLevel(1);
                } else {
                    state.transitioning=false; showScreen('reasoning-screen');
                }
            }, 1500);
        }
    };

    window.selectReasoning = function(choice, event) {
        state.reasoningChoice = choice;
        document.querySelectorAll('.reasoning-opt').forEach(opt => {
            opt.style.borderColor = 'var(--primary)';
            opt.style.background = '#eef6ff';
        });
        event.currentTarget.style.background = 'var(--primary)';
        event.currentTarget.style.color = 'white';
    };

    window.finishGame = function() {
        CQ.attempt(state.reasoningChoice==='A','图像归属理由',{task:'reason',round:state.currentLevel,values:[state.reasoningChoice]});
        if (state.reasoningChoice === 'A') {
            updateScore(20);
            showScreen('result-screen');
            document.getElementById('result-text').innerText = "两轮审核与理由完成："+CQ.complete();
        } else {
            alert("这个选择似乎不太对，再想想？");
        }
    };

    function initLevel(idx) {
        state.currentLevel = idx; CQ.start(idx===0?"第一轮":"第二轮：x+4");
        state.transitioning=false;
        const levelData = state.config.levels[idx];
        document.getElementById('current-rule').innerText = levelData.rule;
        document.getElementById('level-indicator').innerText = `第 ${idx + 1} 关: ${levelData.rule}`;
        
        const grid = document.getElementById('point-grid');
        grid.innerHTML = '';
        
        state.points = levelData.points.map((p, i) => {
            // Calculate expected Y based on rule
            let expectedY;
            if (levelData.rule.includes('2x')) {
                expectedY = 2 * p.x - 1;
            } else {
                expectedY = p.x + 4;
            }

            const pointObj = { ...p, expectedY, ruleText: levelData.rule };
            
            const card = document.createElement('div');
            card.className = 'point-card';
            card.id = `card-${i}`;
            card.innerHTML = `
                <div class="coord-text">(${p.x}, ${p.y})</div>
                <div class="input-group">
                    <label style="font-size: 0.8rem; color: #666;">代入计算结果:</label>
                    <input type="number" id="calc-${i}" placeholder="?">
                    <div class="toggle-btn">
                        <button class="toggle-opt" id="on-${i}" onclick="togglePoint(${i}, true)">属于图像</button>
                        <button class="toggle-opt" onclick="togglePoint(${i}, false)">不属于</button>
                    </div>
                </div>
            `;
            grid.appendChild(card);
            return pointObj;
        });

        // Set initial selection
        togglePoint(0, null);
    }

    window.togglePoint = function(idx, value) {
        // Update UI
        document.querySelectorAll('.point-card').forEach((c, i) => {
            c.classList.toggle('selected', i === idx);
        });
        
        const btnOn = document.getElementById(`on-${idx}`);
        if (value === true) {
            btnOn.classList.add('active');
            btnOn.nextElementSibling.classList.remove('active');
        } else if (value === false) {
            btnOn.classList.remove('active');
            btnOn.nextElementSibling.classList.add('active');
        } else {
            btnOn.classList.remove('active');
            btnOn.nextElementSibling.classList.remove('active');
        }
    }

    function showFeedback(msg, type) {
        const feedback = document.getElementById('feedback');
        feedback.innerText = msg;
        feedback.style.display = 'block';
        feedback.className = type === 'error' ? 'feedback-error' : 'feedback-success';
        
        // Highlight wrong cards
        state.points.forEach((p, i) => {
            const card = document.getElementById(`card-${i}`);
            const calcVal = parseFloat(document.getElementById(`calc-${i}`).value);
            const isOnGraph = document.getElementById(`on-${i}`).classList.contains('active');
            
            if (calcVal !== p.expectedY || isOnGraph !== p.correct) {
                card.classList.add('wrong');
            } else {
                card.classList.remove('wrong');
                card.classList.add('correct');
            }
        });
    }

    function updateScore(points) {
        state.score += points;
        document.getElementById('score').innerText = state.score;
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // Handle number input focus
    document.addEventListener('click', (e) => {
        if (e.target.id.startsWith('card-')) {
            const idx = parseInt(e.target.id.split('-')[1]);
            togglePoint(idx, null);
        }
    });
});
</script>

<script id="openmaic-widget-action-listener">
window.addEventListener('message', function(event) {
  const { type, target, state, content } = event.data;

  switch (type) {
    case 'SET_WIDGET_STATE':
      // Apply state to controls / game params. Keys map to controls by id;
      // route to the game via a global setter when one exists.
      if (state) {
        Object.entries(state).forEach(([key, value]) => {
          const control = document.getElementById(key + '-slider') || document.getElementById(key) || document.querySelector('[data-var="' + key + '"]');
          if (control) {
            control.value = value;
            control.dispatchEvent(new Event('input', { bubbles: true }));
          }
          if (typeof window.setGameParam === 'function') window.setGameParam(key, value);
        });
      }
      break;

    case 'HIGHLIGHT_ELEMENT':
      const highlightEl = document.querySelector(target);
      if (highlightEl) {
        highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
        highlightEl.style.outlineOffset = '4px';
        highlightEl.style.animation = 'pulse-highlight 2s infinite';
        setTimeout(() => {
          highlightEl.style.outline = '';
          highlightEl.style.animation = '';
        }, 3000);
      }
      break;

    case 'ANNOTATE_ELEMENT':
      const annotateEl = document.querySelector(target);
      if (annotateEl && content) {
        const rect = annotateEl.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'teacher-annotation';
        tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s;';
        tooltip.textContent = content;
        document.body.appendChild(tooltip);
        setTimeout(() => tooltip.remove(), 4000);
      }
      break;

    case 'REVEAL_ELEMENT':
      const revealEl = document.querySelector(target);
      if (revealEl) {
        revealEl.style.display = '';
        revealEl.style.opacity = '1';
      }
      break;
  }
});

const style = document.createElement('style');
style.textContent = '@keyframes pulse-highlight { 0%, 100% { outline-color: rgba(139, 92, 246, 0.8); } 50% { outline-color: rgba(139, 92, 246, 0.4); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);
</script>
