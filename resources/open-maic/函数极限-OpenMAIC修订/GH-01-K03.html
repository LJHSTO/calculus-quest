<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>构造挑战：位置与方向</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f0f4f8;
            --card: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            padding: 20px;
            background: var(--primary);
            color: white;
        }
        .header h1 { margin: 0; font-size: 1.5rem; }
        .header p { margin: 5px 0 0; opacity: 0.9; font-size: 0.9rem; }

        /* Game Area */
        .game-main {
            display: flex;
            flex-direction: column;
            padding: 20px;
            gap: 20px;
        }

        /* Canvas Container */
        .canvas-wrapper {
            position: relative;
            background: #f9f9f9;
            border: 2px solid #eee;
            border-radius: 8px;
            aspect-ratio: 16/9;
            width: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Controls */
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
            background: #f1f3f5;
            padding: 15px;
            border-radius: 8px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 0.8rem;
            font-weight: bold;
            color: #666;
        }

        input[type="number"] {
            width: 100%;
            padding: 8px;
            border: 2px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            text-align: center;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
            outline: none;
        }

        /* Action Buttons */
        .action-bar {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1rem;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-secondary { background: #95a5a6; color: white; }
        .btn-hint { background: #f39c12; color: white; }

        /* Feedback Area */
        .feedback {
            padding: 15px;
            border-radius: 8px;
            display: none;
            animation: fadeIn 0.3s;
        }
        .feedback.error { background: #fdf2f2; border-left: 4px solid var(--danger); display: block; }
        .feedback.success { background: #f0fff4; border-left: 4px solid var(--success); display: block; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Level Indicator */
        .level-badge {
            display: inline-block;
            padding: 4px 12px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 0.8rem;
            margin-bottom: 10px;
        }

        /* Explanation Modal */
        .explanation-options {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #eef2f7;
            border-radius: 8px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            padding: 10px;
            margin: 5px 0;
            background: white;
            border: 1px solid #ccc;
            border-radius: 4px;
            cursor: pointer;
        }
        .option-btn:hover { border-color: var(--primary); }

        /* Start Screen */
        #start-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }
        #start-screen > button { flex: 0 0 auto; }

        .hidden { display: none !important; }

        /* Mobile Adjustments */
        @media (max-width: 600px) {
            .controls { grid-template-columns: 1fr 1fr; }
            .header h1 { font-size: 1.2rem; }
        }
    </style>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const katexOptions = {
        delimiters: [
            {left: '\\[', right: '\\]', display: true},
            {left: '\\(', right: '\\)', display: false},
            {left: '$$', right: '$$', display: true},
            {left: '$', right: '$', display: false}
        ],
        throwOnError: false,
        strict: false,
        trust: true
    };

    let renderTimeout;
    function safeRender() {
        if (renderTimeout) clearTimeout(renderTimeout);
        renderTimeout = setTimeout(() => {
            renderMathInElement(document.body, katexOptions);
        }, 100);
    }

    renderMathInElement(document.body, katexOptions);

    const observer = new MutationObserver((mutations) => {
        let shouldRender = false;
        mutations.forEach((mutation) => {
            if (mutation.target &&
                mutation.target.className &&
                typeof mutation.target.className === 'string' &&
                mutation.target.className.includes('katex')) {
                return;
            }
            shouldRender = true;
        });

        if (shouldRender) {
            safeRender();
        }
    });

    observer.observe(document.body, {
        childList: true,
        subtree: true,
        characterData: true
    });

    setInterval(() => {
        const text = document.body.innerText;
        if (text.includes('\\(') || text.includes('$$')) {
            safeRender();
        }
    }, 2000);
});
</script>

(function () {

  function render() {
    const list=document.getElementById('cq-record-list'); if(!list) return;

  }
  window.CQ = {
    start(label) { current=label; entry(); render(); },
    hint() { entry().hints++; render(); },
    attempt(correct,detail,parameters) { if(parameters) window.OpenMaicLearningEvidence?.recordChallenge({challenge_id:"GH-01-K03"+"-maic-"+parameters.task+"-"+parameters.round,knowledge_point_id:"GH-01-K03",is_correct:!!correct,independent:false,evidence_scope:"openmaic_game_attempt",feedback_version:"openmaic-games-20261102-v1",parameters}); entry().attempts.push({correct:!!correct,detail:String(detail||''),time:new Date().toISOString()}); render(); return !!correct; },
    complete() { const e=entry(); e.completed=true; render(); return category(e); },
    summary() { return Array.from(rounds.values()).map(e=>({...e,completion:e.completed?category(e):null})); }
  };
  entry();
  document.addEventListener('click',e=>{ const b=e.target.closest?.('button'); if(b && (b.id==='hint-btn'||b.id==='btn-hint'||/showHint\s*\(/.test(b.getAttribute('onclick')||'')||/^(提示|查看提示|显示提示|提示一下|💡\s*提示)$/.test(b.textContent.trim()))) CQ.hint(); },true);
  document.addEventListener('DOMContentLoaded',()=>{
    const p=document.createElement('details'); p.id='cq-record';
    p.style.cssText='position:fixed;left:8px;bottom:8px;z-index:100;max-width:min(360px,90vw);padding:6px 10px;border:1px solid #64748b;border-radius:8px;background:#fff;color:#172033;font:12px/1.6 system-ui';
    p.innerHTML='<summary style="cursor:pointer">本页练习记录</summary><div id="cq-record-list" style="white-space:pre-wrap"></div><small>记录主动提示按钮；页面常驻说明不计次数。重试保留记录；未用提示不等于独立掌握。</small>';
    document.body.appendChild(p); render();
  });
})();
</script>

<body>

<div id="game-container">
    <div class="header">
        <h1>构造挑战：位置与方向</h1>
        <p>通过调整端点纵坐标，构造满足条件的折线。</p>
    </div>

    <div class="game-main">
        <div id="level-info" class="level-badge">关卡 1</div>
        <div id="target-text" style="font-weight: bold; color: var(--primary); margin-bottom: 10px;">
            目标：整条折线始终低于横轴，但第一段上升。
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls" id="input-controls">
            <!-- Inputs generated by JS -->
        </div>

        <div class="action-bar">
            <button class="btn-secondary" onclick="resetGame()">重置本页</button>
            <button class="btn-hint" onclick="showHint()">提示</button>
            <button class="btn-primary" onclick="checkConstruction()">提交构造</button>
        </div>

        <div id="feedback" class="feedback"></div>

        <div id="explanation" class="explanation-options">
            <p style="margin-top:0; font-weight:bold;">解释：为什么位置（在轴上方/下方）不决定方向（上升/下降）？</p>
            <button class="option-btn" onclick="checkExplanation('A')">A. 只要输出都是负数，折线就上升</button>
            <button class="option-btn" onclick="checkExplanation('B')">B. 输出都是负数只说明折线在横轴下方，上升下降要看输出随输入增大是变大还是变小</button>
            <button class="option-btn" onclick="checkExplanation('C')">C. 是否上升取决于横坐标是否都是正数</button>
        </div>
    </div>

    <!-- Start Screen -->
    <div id="start-screen">
        <h2>准备好开始挑战了吗？</h2>
        <p>你将通过调整数字来改变折线的形状。<br>记住：位置（正负）和方向（升降）是独立的！</p>
        <button class="btn-primary" style="width: 200px; margin-top: 20px;" onclick="startGame()">开始游戏</button>
    </div>
</div>

<script type="application/json" id="widget-config">
{
  "type": "game",
  "gameType": "construction",
  "levels": [
    {
      "id": 1,
      "target": "整条折线始终低于横轴，但第一段上升。",
      "points": 3,
      "validate": "y0 < 0 && y1 < 0 && y2 < 0 && y1 > y0"
    },
    {
      "id": 2,
      "target": "整条折线始终高于横轴，但第一段下降。",
      "points": 3,
      "validate": "y0 > 0 && y1 > 0 && y2 > 0 && y1 < y0"
    },
    {
      "id": 3,
      "target": "解释构造原理",
      "points": 3,
      "validate": "explanation == 'B'"
    },
    {
      "id": 4,
      "target": "整条折线始终在横轴上方，中间一段不变，最后一段下降。",
      "points": 4,
      "validate": "y0 > 0 && y1 > 0 && y2 > 0 && y3 > 0 && y2 == y1 && y3 < y2"
    }
  ]
}
</script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const config = JSON.parse(document.getElementById('widget-config').textContent);
    
    let currentLevel = 0;
    let points = [0, 0, 0, 0]; // y0, y1, y2, y3
    let hintUsed = false;
    let gameActive = false;

    // Initialize Canvas Size
    function resize() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width * window.devicePixelRatio;
        canvas.height = rect.height * window.devicePixelRatio;
        ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        draw();
    }
    window.addEventListener('resize', resize);
    resize();

    // Global Functions for UI
    window.startGame = function() {
        document.getElementById('start-screen').classList.add('hidden');
        gameActive = true;
        initLevel(0);
    };

    window.resetGame = function() {
        currentLevel = 0;
        points = [0, 0, 0, 0];
        hintUsed = false;
        initLevel(0);
    };

    window.showHint = function() {
        hintUsed = true;
        const feedback = document.getElementById('feedback');
        feedback.className = 'feedback success';
        feedback.innerHTML = '<strong>提示：</strong> 观察纵坐标的变化。如果 y1 > y0，说明第一段是上升的。位置（正负）只决定在轴哪边，不决定升降。';
    };

    function initLevel(idx) {
        gameActive=true;
        currentLevel = idx; if(idx===0) CQ.start('第一轮'); if(idx===1) CQ.start('第二轮：正值下降'); if(idx===3) CQ.start('第三轮：四点折线');
        const level = config.levels[idx];
        document.getElementById('level-info').textContent = `关卡 ${level.id}`;
        document.getElementById('target-text').textContent = `目标：${level.target}`;
        
        // Setup Inputs
        const inputContainer = document.getElementById('input-controls');
        inputContainer.innerHTML = '';
        
        for (let i = 0; i < level.points; i++) {
            const group = document.createElement('div');
            group.className = 'input-group';
            group.innerHTML = `
                <label>端点 ${i} 纵坐标 (y${i})</label>
                <input type="number" min="-9" max="9" value="0" 
                       oninput="updatePoint(${i}, this.value)">
            `;
            inputContainer.appendChild(group);
        }

        // Hide explanation for non-level-3
        document.getElementById('explanation').style.display = idx===2?'block':'none';
        document.getElementById('feedback').style.display = 'none';
        
        points = [0, 0, 0, 0];
        draw();
    }

    window.updatePoint = function(idx, val) {
        points[idx] = parseFloat(val) || 0;
        draw();
    };

    function draw() {
        const w = canvas.width / window.devicePixelRatio;
        const h = canvas.height / window.devicePixelRatio;
        ctx.clearRect(0, 0, w, h);

        // Grid
        ctx.strokeStyle = '#e0e0e0';
        ctx.lineWidth = 1;
        const step = Math.max(12, Math.min(40, (w - 70) / 7, (h - 30) / 10));
        const originX = 50;
        const originY = h / 2;

        for (let x = originX; x < w; x += step) {
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let y = originY; y < h; y += step) {
            ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }

        // Axes
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, h); ctx.stroke();

        // 先画连续直线段，再画端点，避免arc的beginPath切断折线。
        const numPoints=config.levels[currentLevel].points, xCoords=[0,2,4,6];
        ctx.strokeStyle=varColor('--primary'); ctx.lineWidth=3; ctx.beginPath();
        for(let i=0;i<numPoints;i++) { const px=originX+xCoords[i]*step,py=originY-points[i]*step; if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py); }
        ctx.stroke(); ctx.fillStyle=varColor('--primary');
        for(let i=0;i<numPoints;i++){ctx.beginPath();ctx.arc(originX+xCoords[i]*step,originY-points[i]*step,5,0,Math.PI*2);ctx.fill();}
    }


    function varColor(name) {
        return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    }

    window.checkConstruction = function() {
        if(currentLevel===2) return;
        const level = config.levels[currentLevel];
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        
        let success = false;
        let errorMsg = "";

        if (currentLevel === 0) {
            if (points[0] >= 0 || points[1] >= 0 || points[2] >= 0) {
                errorMsg = "始终低于横轴要求三个输出都小于 0，端点落在横轴上或上方就不算。";
            } else if (points[1] <= points[0]) {
                errorMsg = "位置对了，但方向反了：第一段的输出没有变大，所以这一段在下降或不变。";
            } else {
                success = true;
            }
        } else if (currentLevel === 1) {
            if (points[0] <= 0 || points[1] <= 0 || points[2] <= 0) {
                errorMsg = "始终高于横轴要求三个输出都大于 0，端点落在横轴上或下方就不算。";
            } else if (points[1] >= points[0]) {
                errorMsg = "位置对了，但方向反了：第一段的输出没有变小，所以这一段在上升或不变。";
            } else {
                success = true;
            }
        } else if (currentLevel === 3) {
            if (points[0] <= 0 || points[1] <= 0 || points[2] <= 0 || points[3] <= 0) {
                errorMsg = "始终在横轴上方要求四个输出都大于 0。";
            } else if (points[2] !== points[1]) {
                errorMsg = "中间一段不变要求 y2 等于 y1。";
            } else if (points[3] >= points[2]) {
                errorMsg = "最后一段下降要求 y3 小于 y2。";
            } else {
                success = true;
            }
        }

        CQ.attempt(success,"构造折线",{task:"construction",round:currentLevel,values:points.slice()});
        if (success) {
            if(!gameActive) return; gameActive=false; CQ.complete();
            feedback.className = 'feedback success';
            feedback.innerHTML = '<strong>太棒了！构造成功！</strong>';
            if (currentLevel < 2) {
                window.R7Continue(() => initLevel(currentLevel + 1));
            } else if (currentLevel === 3) {
                document.getElementById('target-text').textContent='全部构造完成：'+CQ.complete();
                document.getElementById('input-controls').innerHTML='<p>三组数据均通过数学条件校验。</p>'; 
            }
        } else {
            feedback.className = 'feedback error';
            feedback.innerHTML = `<strong>未达成：</strong> ${errorMsg}`;
        }
    };

    window.checkExplanation = function(choice) {
        const feedback = document.getElementById('feedback');
        feedback.style.display='block';
        if(currentLevel!==2) return; CQ.attempt(choice==='B','构造理由',{task:'reason',round:currentLevel,values:[choice]});
        if (choice === 'B') {
            CQ.complete(); initLevel(3); return;
            feedback.className = 'feedback success';
            feedback.innerHTML = '<strong>完全正确！</strong> 你理解了位置与方向的独立性。挑战完成！';
            document.getElementById('explanation').style.display = 'none';
            // Final state
            document.getElementById('target-text').textContent = "🎉 恭喜通关！你已掌握构造技巧。";
            document.getElementById('input-controls').innerHTML = '<p>点击“重置本页”再玩一次</p>';
        } else {
            feedback.className = 'feedback error';
            let msg = choice === 'A' ? "不对哦，你刚才构造的折线在横轴下方，但第一段是上升的，说明负数也可以上升。" : "不对哦，横坐标的正负不影响上升下降，关键看纵坐标的变化。";
            feedback.innerHTML = `<strong>解释有误：</strong> ${msg}`;
        }
    };
});
</script>

<script id="openmaic-widget-action-listener">
window.addEventListener('message', function(event) {
  const { type, target, state, content } = event.data;

  switch (type) {
    case 'SET_WIDGET_STATE':
      // Apply state to controls / game params. Keys map to controls by id;
      // route to the game via a global setter when one exists.
      if (state) {
        Object.entries(state).forEach(([key, value]) => {
          const control = document.getElementById(key + '-slider') || document.getElementById(key) || document.querySelector('[data-var="' + key + '"]');
          if (control) {
            control.value = value;
            control.dispatchEvent(new Event('input', { bubbles: true }));
          }
          if (typeof window.setGameParam === 'function') window.setGameParam(key, value);
        });
      }
      break;

    case 'HIGHLIGHT_ELEMENT':
      const highlightEl = document.querySelector(target);
      if (highlightEl) {
        highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
        highlightEl.style.outlineOffset = '4px';
        highlightEl.style.animation = 'pulse-highlight 2s infinite';
        setTimeout(() => {
          highlightEl.style.outline = '';
          highlightEl.style.animation = '';
        }, 3000);
      }
      break;

    case 'ANNOTATE_ELEMENT':
      const annotateEl = document.querySelector(target);
      if (annotateEl && content) {
        const rect = annotateEl.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'teacher-annotation';
        tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s;';
        tooltip.textContent = content;
        document.body.appendChild(tooltip);
        setTimeout(() => tooltip.remove(), 4000);
      }
      break;

    case 'REVEAL_ELEMENT':
      const revealEl = document.querySelector(target);
      if (revealEl) {
        revealEl.style.display = '';
        revealEl.style.opacity = '1';
      }
      break;
  }
});

const style = document.createElement('style');
style.textContent = '@keyframes pulse-highlight { 0%, 100% { outline-color: rgba(139, 92, 246, 0.8); } 50% { outline-color: rgba(139, 92, 246, 0.4); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);
</script>

 {id:'GH-01-K03',title:'图像的上升、下降与变化方向',minutes:8,
  goal:'按输入顺序比较输出，区分样本判断与全区间判断，构造有效反例。',
  core:'严格上升是在选定区间内，对任意x₁<x₂都有f(x₁)<f(x₂)。严格下降则要求f(x₁)>f(x₂)。输出正负表示相对横轴的位置；增减表示有序输入对应的输出如何变化。',
  example:{title:'负输出也可以先增大再减小',setup:'输入0、1、2的输出依次为−4、−1、−3。',steps:['从输入0到1：−4<−1，样本输出增大。','从输入1到2：−1>−3，样本输出减小。','三个输出都是负数，但两次变化方向不同。'],conclusion:'要看输出之间的大小关系，不是只看它们是正数还是负数。'},
  extension:{title:'一个反例能说明多少',setup:'有人断言f(x)=x²在[−3,3]上严格上升。',steps:['取x₁=−2、x₂=−1，满足x₁<x₂。','f(−2)=4，而f(−1)=1；较大输入反而对应较小输出。','这一对已否定“整个区间严格上升”，但没有证明整个区间下降；0右侧的平方值仍在增大。'],conclusion:'反驳全称判断只需一个有效反例；证明全称判断需要覆盖整个区间的依据。'},
  caution:'连续也不保证单调。有限个上升的记录之间仍可能出现局部下降，不能把“屏幕中暂时没看到”当成“不存在”。',
  transfer:'比较两条模型曲线时，可以找一个区分性输入；如果旧样本全部相同，也不能直接宣布两条规则在所有输入上相同。',refs:['CN-TJ-1.1','CN-SC-1.1','CN-SCZ-1.2']},
 {id:'GH-02-K01',title:'从数表观察趋近',minutes:12,
  goal:'区分a、L与f(a)，从数表过渡到邻域规则，用误差关系给出对所有允许输入有效的范围。',
  core:'a是输入靠近的位置，L是附近输出趋近的数，f(a)是输入恰好为a时的输出。讨论x→a时看x≠a的邻近输入；L不由单点取值决定。数表提供线索，规则让我们说明未列出的邻近输入。',
  example:{title:'从倍率1到倍率3',setup:'x≠2时g(x)=3x+1，另设g(2)=0。要求附近输出与7的距离小于0.3。',steps:['附近规则给出L=7；点值g(2)=0另看。','|g(x)−7|=|3x+1−7|=3|x−2|：输出误差是输入误差的3倍。','取0<|x−2|<0.1，就有|g(x)−7|<0.3。取更小的正半径也有效，不必取最大半径。'],conclusion:'本例应将允许的输出误差除以3；不能照搬倍率1时“输入误差等于输出误差”的数值。'},
  extension:{title:'“足够近”需要保证所有输入',setup:'用ε表示给定的正输出误差，用δ表示待选的正输入范围半径。',steps:['先给ε>0，再根据规则选择δ>0；不是先固定一批测试点。','若附近f(x)=k(x−a)+L且k≠0，取0<δ≤ε/|k|，就能保证0<|x−a|<δ时，|f(x)−L|<ε。','k=0时附近输出恒为L，误差为0；任何仍落在该规则适用邻域内的正δ都有效。'],conclusion:'一次试点合格不是范围保证。这里的线性公式为邻域内全部允许输入提供了依据。'},
  caution:'x→∞是输入不断增大，和x→a不是同一种方向。例3+1/x在x→∞时趋近3，但有限正输入处不等于3。离散轮次n则是数列，不能只凭有限训练曲线宣布收敛。',
  transfer:'一个简化预测器ŷ=3x+1中，输入误差0.02会造成输出误差0.06。这里说明的是固定模型对输入扰动的反应，不是证明模型对新数据预测准确。',refs:['CN-TJ-1.3','CN-TJ-1.5','CN-SC-1.3','OS-2.5','GOOGLE-LOSS']},
 {id:'GH-02-K02',title:'图像上的左右极限',minutes:9,
  goal:'分别使用两侧规则，先检查各侧有限趋近，再比较共同值；区分跳跃、无界与不收敛。',
  core:'左极限使用小于a的邻近输入，右极限使用大于a的邻近输入。双侧有限极限存在，当且仅当两侧有限极限都存在且相等。该点的值和两侧平均值都不能代替共同极限。',
  example:{title:'先算两侧，再选拼接参数',setup:'x<1时f(x)=2x+k；x>1时f(x)=x+3；f(1)=9。',steps:['从左侧靠近1，2x+k趋近2+k。','从右侧靠近1，x+3趋近4。','要有共同有限极限，令2+k=4，得k=2。此时左右都趋近4，公式不必相同。'],conclusion:'只改f(1)不会改变k=2这个条件；共同极限为4，点值9另看。'},
  extension:{title:'“没有有限极限”有不同原因',setup:'把下面三种情形分开判断。',steps:['有限跳跃：左侧趋近1，右侧趋近3。两侧各自有有限极限，但不相等。','无界：1/x²在两侧靠近0时越来越大，没有有限上界；不能把正无穷当作一个有限实数。','不收敛：若两列都趋近0的正输入，其输出已由规则证明恒为1与−1，右侧不能趋近同一个数。'],conclusion:'结论“不存在”之后，还要说明有限性或相等性在哪一步失败。'},
  caution:'只给几行数表不能证明无界或振荡；必须结合完整规则，或已证明性质的趋近序列。',
  transfer:'分类例子：分数s(x)=x连续；规定x<0.5输出类别0，x≥0.5输出类别1。类别函数左右分别趋近0和1，存在跳变。阈值处归到哪类必须由规则明确。',refs:['CN-TJ-1.3','CN-SC-1.3','GOOGLE-THRESHOLD']},
 {id:'GH-02-K03',title:'连续就是不跳断',minutes:8,
  goal:'依次核对点值、共同有限极限与相等关系，在给定修改权限下决定能否修复。',
  core:'在定义域内点a处连续，需要f(a)有定义、双侧有限极限L存在，而且f(a)=L。点值缺失或不合适时，只有共同有限极限已经存在，才可以通过补点修复。端点只按定义域允许的一侧判断。',
  example:{title:'先判断能否修，再决定补什么',setup:'左侧趋近4，右侧趋近4，原点值为9；只允许改点值。',steps:['原点值有定义；左右都有共同有限极限4。','原点值9与极限4不同，所以原函数在该点不连续。','把点值改为4，三项条件同时满足；附近的规则无需改动。'],conclusion:'补点的值来自共同极限，不是随意选一个“看起来居中”的数。'},
  extension:{title:'跳跃不能补一个点解决，尖角却可以连续',setup:'对照两种容易混淆的图形。',steps:['左侧趋近4、右侧趋近5时，没有共同极限。无论把点值设在哪里，都不能同时等于4和5。','g(x)=|x|在0的左右极限都是0，g(0)=0，所以连续。','|x|有尖角但不间断；是否可导是后续课程中的另一个问题。'],conclusion:'连续、光滑与可导不能当成同一个概念。'},
  caution:'若允许改变邻域规则，可以先调参数让两侧趋近值一致，再令点值等于共同值。作答时要说明你使用了哪一种修改权限。',
  transfer:'例如左侧f(x)=2x+k，右侧f(x)=x+3，在x=1拼接：先令2+k=4得到k=2，再设f(1)=4。只求k还没有完成三个连续条件。',refs:['CN-TJ-1.8','CN-TJ-1.9','OS-2.4']}
 ];

 return {version,lessons,byId:Object.fromEntries(lessons.map(x=>[x.id,x])),learningMinutes:60,openingMinutes:3,closingMinutes:3};
