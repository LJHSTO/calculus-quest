<script>
document.addEventListener('DOMContentLoaded', function() {
    const config = JSON.parse(document.getElementById('widget-config').textContent);
    
    let currentLevelIdx = 0;
    let score = 0;
    let selectedInput = null;
    let usedHint = false;
    let gameActive = false;
    function calculateRule(index,x) { return currentLevelIdx===0 ? (index===0?2*x+1:x*x+x+1) : (index===0?3*x-1:x*x+1); }

    // Global functions for inline onclick
    window.startGame = function() {
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('game-screen').classList.add('active');
        gameActive = true;
        initLevel();
    };

    window.resetGame = function() {
        document.getElementById("result-screen").classList.remove("active"); document.getElementById("game-screen").classList.add("active");
        currentLevelIdx = 0;
        score = 0;
        usedHint = false;
        document.getElementById('hint-box').style.display = 'none';
        document.getElementById('hint-box').textContent = '';
        initLevel();
    };

    window.showHint = function() {
        usedHint = true;
        const hintBox = document.getElementById('hint-box');
        hintBox.style.display = 'block';
        hintBox.textContent = "提示：观察两条规则的公式，尝试代入一个不在已知点里的数字，看看结果是否一样。";
    };

    function initLevel() {
        const level = config.levels[currentLevelIdx];
        gameActive=true;
        selectedInput = null; CQ.start(currentLevelIdx===0?"第一轮":"第二轮：新规则");
        
        // Update UI
        document.getElementById('level-title').textContent = `第 ${currentLevelIdx + 1} 关：寻找反例`;
        document.getElementById('score-display').textContent = `积分: ${score}`;
        
        // Points
        document.getElementById('p1').textContent = `(${level.points[0][0]}, ${level.points[0][1]})`;
        document.getElementById('p2').textContent = `(${level.points[1][0]}, ${level.points[1][1]})`;
        
        // Rules
        document.getElementById('rule-a-text').textContent = level.rules[0].formula;
        document.getElementById('rule-b-text').textContent = level.rules[1].formula;
        
        // Inputs
        const inputGrid = document.getElementById('input-grid');
        inputGrid.innerHTML = '';
        level.inputs.forEach(val => {
            const btn = document.createElement('button');
            btn.className = 'input-btn';
            btn.textContent = val;
            btn.onclick = () => selectInput(val, btn);
            inputGrid.appendChild(btn);
        });

        // Reset inputs
        document.getElementById('out-a').value = '';
        document.getElementById('out-b').value = '';
        document.getElementById('feedback').style.display = 'none';
        
        // Show step 1
        document.getElementById('input-section').style.display = 'block';
        document.getElementById('conclusion-section').style.display = 'none';
        
        // Steps
        document.querySelectorAll('.step-dot').forEach((dot, i) => {
            dot.className = 'step-dot';
            if (i === 0) dot.classList.add('active');
        });
    }

    function selectInput(val, btn) {
        selectedInput = val;
        document.querySelectorAll('.input-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
    }

    window.submitComparison = function() {
        const level = config.levels[currentLevelIdx];
        const outA = document.getElementById('out-a').value;
        const outB = document.getElementById('out-b').value;
        const feedback = document.getElementById('feedback');
        
        if (selectedInput === null) {
            showFeedback("请先选择一个输入 x", "error");
            return;
        }

        // Check if input is a known point
        const isKnown = level.points.some(p => p[0] === selectedInput);
        if (isKnown) {
            showFeedback(`这两个输入正是已知点，两条规则在这里本来就相同，不能用它们区分规则，请换一个不在已知点里的输入`, "error");
            return;
        }

        const trueA = calculateRule(0,selectedInput);
        const trueB = calculateRule(1,selectedInput);

        CQ.attempt(outA !== "" && outB !== "" && Number(outA) === trueA && Number(outB) === trueB, "两个输出预测", {task:"outputs",round:currentLevelIdx,values:[selectedInput,Number(outA),Number(outB)]});
        if (outA !== "" && outB !== "" && parseFloat(outA) === trueA && parseFloat(outB) === trueB) {
            if (trueA === trueB) {
                showFeedback("这两条规则在这个点输出相同，无法区分它们，请换一个输入", "error");
            } else {
                showFeedback("太棒了！你找到了一个反例，两条规则在这里输出不同。", "success");
                score += 10;
                showConclusion();
            }
        } else {
            let errorMsg = "计算有误：";
            if (outA !== "" && parseFloat(outA) !== trueA) errorMsg += `甲在 x=${selectedInput} 时是 ${trueA}。`;
            if (outB !== "" && parseFloat(outB) !== trueB) errorMsg += ` 乙在 x=${selectedInput} 时是 ${trueB}。`;
            showFeedback(errorMsg, "error");
        }
    };

    function showFeedback(msg, type) {
        const feedback = document.getElementById('feedback');
        feedback.textContent = msg;
        feedback.className = `feedback ${type}`; feedback.style.display="block";
    }

    function showConclusion() {
        const level = config.levels[currentLevelIdx];
        document.getElementById('input-section').style.display = 'none';
        document.getElementById('conclusion-section').style.display = 'block';
        
        // Update comparison table
        document.getElementById('comp-pred-a').textContent = document.getElementById('out-a').value;
        document.getElementById('comp-pred-b').textContent = document.getElementById('out-b').value;
        document.getElementById('comp-true-a').textContent = calculateRule(0,selectedInput);
        document.getElementById('comp-true-b').textContent = calculateRule(1,selectedInput);

        // Update steps
        document.getElementById('step-1').classList.replace('active', 'done');
        document.getElementById('step-2').classList.add('active');

        // Options
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        level.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt.text;
            btn.onclick = () => selectOption(opt);
            optionsContainer.appendChild(btn);
        });
    }

    function selectOption(opt) {
        const feedback = document.getElementById('feedback');
        CQ.attempt(opt.correct,"反例解释",{task:"reason",round:currentLevelIdx,values:[config.levels[currentLevelIdx].options.indexOf(opt)]});
        if (opt.correct) {
            if(!gameActive) return; gameActive=false; CQ.complete();
            showFeedback("结论正确！你成功证明了两个点不能确定唯一规则。", "success");
            score += 20;
            nextLevel();
        } else {
            if (opt.text.includes("相同")) {
                showFeedback("在这点两条规则输出不同，说明它们是不同的规则", "error");
            } else {
                showFeedback("再多有限个点也只能排除规则，不能证明唯一，因为总可以另造一条规则与已知点一致", "error");
            }
        }
    }

    function nextLevel() {
        currentLevelIdx++;
        if (currentLevelIdx < config.levels.length) {
            setTimeout(initLevel, 1000);
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('game-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        const resultDesc = document.getElementById('result-desc');
        resultDesc.innerHTML = `最终积分: ${score}<br>${CQ.complete()}`;
        
        // Save progress
    }
});
</script>

<script id="openmaic-widget-action-listener">
window.addEventListener('message', function(event) {
  const { type, target, state, content } = event.data;

  switch (type) {
    case 'SET_WIDGET_STATE':
      // Apply state to controls / game params. Keys map to controls by id;
      // route to the game via a global setter when one exists.
      if (state) {
        Object.entries(state).forEach(([key, value]) => {
          const control = document.getElementById(key + '-slider') || document.getElementById(key) || document.querySelector('[data-var="' + key + '"]');
          if (control) {
            control.value = value;
            control.dispatchEvent(new Event('input', { bubbles: true }));
          }
          if (typeof window.setGameParam === 'function') window.setGameParam(key, value);
        });
      }
      break;

    case 'HIGHLIGHT_ELEMENT':
      const highlightEl = document.querySelector(target);
      if (highlightEl) {
        highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
        highlightEl.style.outlineOffset = '4px';
        highlightEl.style.animation = 'pulse-highlight 2s infinite';
        setTimeout(() => {
          highlightEl.style.outline = '';
          highlightEl.style.animation = '';
        }, 3000);
      }
      break;

    case 'ANNOTATE_ELEMENT':
      const annotateEl = document.querySelector(target);
      if (annotateEl && content) {
        const rect = annotateEl.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'teacher-annotation';
        tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s;';
        tooltip.textContent = content;
        document.body.appendChild(tooltip);
        setTimeout(() => tooltip.remove(), 4000);
      }
      break;

    case 'REVEAL_ELEMENT':
      const revealEl = document.querySelector(target);
      if (revealEl) {
        revealEl.style.display = '';
        revealEl.style.opacity = '1';
      }
      break;
  }
});

const style = document.createElement('style');
style.textContent = '@keyframes pulse-highlight { 0%, 100% { outline-color: rgba(139, 92, 246, 0.8); } 50% { outline-color: rgba(139, 92, 246, 0.4); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);
</script>
