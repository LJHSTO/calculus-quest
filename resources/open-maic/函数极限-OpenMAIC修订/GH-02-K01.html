<script>
document.addEventListener('DOMContentLoaded', function() {
    // Game State
    let state = {
        currentLevel: 0,
        selectedPoint: null,
        prediction: null,
        samples: [],
        usedHint: false,
        config: JSON.parse(document.getElementById('widget-config').textContent)
    };

    // Global functions for inline onclick
    window.startGame = function() {
        showScreen('game-screen');
        initLevel();
    };

    window.setPrediction = function(val) {
        state.prediction = val;
        document.getElementById('pred-yes').classList.toggle('active', val === true);
        document.getElementById('pred-no').classList.toggle('active', val === false);
        document.getElementById('submit-point-btn').disabled = (state.selectedPoint === null || state.prediction === null);
    };

    window.submitPoint = function() {
        const level = state.config.levels[state.currentLevel];
        const x = state.selectedPoint; if(x===null || state.prediction===null || state.transitioning) return;
        
        // Calculate actual outputs
        let outA, outB;
        if (state.currentLevel === 0) {
            outA = x + 3;
            outB = x < 2 ? x + 3 : 2 * x + 1;
        } else {
            outA = x + 2;
            outB = x < 0 ? x + 2 : 3 * x + 2;
        }

        const predictionCorrect=state.prediction===(outA!==outB); CQ.attempt(predictionCorrect,"所选观测点能否区分",{task:"prediction",round:state.currentLevel,values:[x,state.prediction]});
        // Add to samples
        state.samples.push({ x, a: outA, b: outB });
        renderTable();

        // Feedback
        const feedback = document.getElementById('feedback');
        feedback.style.display = 'block';
        
        if (outA !== outB) {
            state.transitioning=true;
            feedback.innerHTML = `<strong style="color:var(--success)">成功区分！</strong><br>两条规则在这里给出 ${outA} 与 ${outB}，说明它们不是同一条规则。`;
            feedback.innerHTML+=(predictionCorrect?"<br>预测与证据一致。":"<br>你的预测需要修正：两个输出不相等，能够区分。");
            feedback.style.background = '#e8f8f0';
            setTimeout(() => {
                showScreen('conclusion-screen');
            }, 2000);
        } else {
            feedback.innerHTML = `<strong style="color:var(--danger)">这个点两条规则给出同一个输出 (${outA})，仍不能区分它们，请另选一个观测点。</strong>`;
            feedback.style.background = '#fdf2f2';
            // Reset selection
            state.selectedPoint = null;
            state.prediction = null;
            document.querySelectorAll('.candidate-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('pred-yes').classList.remove('active');
            document.getElementById('pred-no').classList.remove('active');
            document.getElementById('submit-point-btn').disabled = true;
        }
    };

    window.showHint = function() {
        const hint = document.getElementById('hint-container');
        if (!state.usedHint) {
            hint.style.display = 'block';
            hint.innerHTML = "💡 提示：先把候选输入分别代入两条规则，再比较算出的输出。分段公式换了计算方法，不代表输出一定不同；边界点也要实际算一遍。";
            state.usedHint = true;
        }
    };

    window.checkConclusion = function(choice) {
        const feedback = document.getElementById('conclusion-feedback');
        feedback.style.display = 'block';
        
        CQ.attempt(choice==='A',"有限样本结论",{task:"reason",round:state.currentLevel,values:[choice]});
        if (choice === 'A') {
            if(state.conclusionLocked) return; state.conclusionLocked=true; CQ.complete();
            feedback.innerHTML = `<strong style="color:var(--success)">正确！</strong><br>再多的有限样本也不能证明规则唯一，只能排除或暴露不同。`;
            setTimeout(() => {
                if (state.currentLevel < state.config.levels.length - 1) {
                    state.currentLevel++;
                    initLevel();
                    showScreen('game-screen');
                } else {
                    showResult();
                }
            }, 2500);
        } else {
            feedback.innerHTML = `<strong style="color:var(--danger)">再想想：</strong><br>${choice === 'B' ? '有限个点写得完，总可以另造一条在这些点相同、在其他点不同的规则。' : '在已给两点相同只说明暂时无法区分，样本外的点已经显示不同。'}`;
        }
    };

    window.resetGame = function() {
        state.currentLevel = 0;
        state.usedHint = false;
        document.getElementById('hint-container').style.display = 'none';
        showScreen('start-screen');
    };

    // Internal Helpers
    function initLevel() {
        document.querySelector('#game-screen .rule-box').innerHTML=state.currentLevel===0?'<strong>规则甲：</strong> 输出 = 输入 + 3<br><strong>规则乙：</strong> 输入 &lt; 2 时输出 = 输入 + 3；输入 ≥ 2 时输出 = 2 × 输入 + 1':'<strong>规则甲：</strong> 输出 = 输入 + 2<br><strong>规则乙：</strong> 输入 &lt; 0 时输出 = 输入 + 2；输入 ≥ 0 时输出 = 3 × 输入 + 2';
        CQ.start(state.currentLevel===0?"第一轮":"第二轮：新规则"); state.transitioning=false; state.conclusionLocked=false;
        const level = state.config.levels[state.currentLevel];
        state.samples = level.initialSamples.map(x => {
            let outA, outB;
            if (state.currentLevel === 0) {
                outA = x + 3;
                outB = x < 2 ? x + 3 : 2 * x + 1;
            } else {
                outA = x + 2;
                outB = x < 0 ? x + 2 : 3 * x + 2;
            }
            return { x, a: outA, b: outB };
        });
        
        state.selectedPoint = null;
        state.prediction = null;
        
        document.getElementById('level-title').innerText = `第 ${state.currentLevel + 1} 关：寻找区分点`;
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('submit-point-btn').disabled = true;
        document.getElementById('pred-yes').classList.remove('active');
        document.getElementById('pred-no').classList.remove('active');

        // Render Candidates
        const grid = document.getElementById('candidate-grid');
        grid.innerHTML = '';
        level.candidates.forEach(x => {
            const btn = document.createElement('button');
            btn.className = 'candidate-btn';
            btn.innerText = x;
            btn.onclick = () => {
                document.querySelectorAll('.candidate-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                state.selectedPoint = x;
                document.getElementById('submit-point-btn').disabled = (state.prediction === null);
            };
            grid.appendChild(btn);
        });

        renderTable();
    }

    function renderTable() {
        const tbody = document.getElementById('sample-table-body');
        tbody.innerHTML = '';
        state.samples.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${s.x}</td><td>${s.a}</td><td>${s.b}</td>`;
            tbody.appendChild(tr);
        });
    }

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function showResult() {
        showScreen('result-screen');
        const finalTable = document.getElementById('final-table');
        finalTable.innerHTML = '';
        state.samples.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td>${s.x}</td><td>${s.a}</td><td>${s.b}</td>`;
            finalTable.appendChild(tr);
        });

        document.getElementById('result-desc').innerText='两轮完成。本组：'+CQ.complete()+'。每轮提示与纠错记录见左下角。有限样本相同，不能推出一般规则唯一。';

        showAchievement("逻辑大师");
    }

    function showAchievement(name) {
        const ach = document.getElementById('achievement');
        ach.innerText = `🏆 达成成就：${name}`;
        ach.classList.add('show');
        setTimeout(() => ach.classList.remove('show'), 3000);
    }
});
</script>

<script id="openmaic-widget-action-listener">
window.addEventListener('message', function(event) {
  const { type, target, state, content } = event.data;

  switch (type) {
    case 'SET_WIDGET_STATE':
      // Apply state to controls / game params. Keys map to controls by id;
      // route to the game via a global setter when one exists.
      if (state) {
        Object.entries(state).forEach(([key, value]) => {
          const control = document.getElementById(key + '-slider') || document.getElementById(key) || document.querySelector('[data-var="' + key + '"]');
          if (control) {
            control.value = value;
            control.dispatchEvent(new Event('input', { bubbles: true }));
          }
          if (typeof window.setGameParam === 'function') window.setGameParam(key, value);
        });
      }
      break;

    case 'HIGHLIGHT_ELEMENT':
      const highlightEl = document.querySelector(target);
      if (highlightEl) {
        highlightEl.style.outline = '3px solid rgba(139, 92, 246, 0.8)';
        highlightEl.style.outlineOffset = '4px';
        highlightEl.style.animation = 'pulse-highlight 2s infinite';
        setTimeout(() => {
          highlightEl.style.outline = '';
          highlightEl.style.animation = '';
        }, 3000);
      }
      break;

    case 'ANNOTATE_ELEMENT':
      const annotateEl = document.querySelector(target);
      if (annotateEl && content) {
        const rect = annotateEl.getBoundingClientRect();
        const tooltip = document.createElement('div');
        tooltip.className = 'teacher-annotation';
        tooltip.style.cssText = 'position:fixed; top:' + (rect.top - 40) + 'px; left:' + rect.left + 'px; background:rgba(139,92,246,0.95); color:white; padding:8px 12px; border-radius:8px; font-size:14px; z-index:1000; animation:fadeIn 0.3s;';
        tooltip.textContent = content;
        document.body.appendChild(tooltip);
        setTimeout(() => tooltip.remove(), 4000);
      }
      break;

    case 'REVEAL_ELEMENT':
      const revealEl = document.querySelector(target);
      if (revealEl) {
        revealEl.style.display = '';
        revealEl.style.opacity = '1';
      }
      break;
  }
});

const style = document.createElement('style');
style.textContent = '@keyframes pulse-highlight { 0%, 100% { outline-color: rgba(139, 92, 246, 0.8); } 50% { outline-color: rgba(139, 92, 246, 0.4); } } @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }';
document.head.appendChild(style);
</script>
