<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img">
<title>乘积求导的两项来源</title>
<rect width="640" height="300" fill="#ffffff"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="320" y="34" fill="#273c43" text-anchor="middle" font-size="22">乘积：x · cos(x)</text><line x1="260" y1="52" x2="155" y2="94" stroke="#273c43" stroke-width="1.5"/><line x1="380" y1="52" x2="485" y2="94" stroke="#273c43" stroke-width="1.5"/><text x="155" y="119" fill="#273c43" text-anchor="middle" font-size="17">第一因子求导</text><text x="485" y="119" fill="#273c43" text-anchor="middle" font-size="17">第二因子求导</text><text x="155" y="157" fill="#087e79" text-anchor="middle" font-size="24">1 · cos(x)</text><text x="485" y="157" fill="#b33b55" text-anchor="middle" font-size="24">x · [−sin(x)]</text><line x1="155" y1="175" x2="275" y2="216" stroke="#273c43" stroke-width="1.5"/><line x1="485" y1="175" x2="365" y2="216" stroke="#273c43" stroke-width="1.5"/><text x="320" y="250" fill="#273c43" text-anchor="middle" font-size="23">(x · cos(x))′ = cos(x) − x · sin(x)</text></g>
</svg>
