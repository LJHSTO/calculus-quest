<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="continuity-repair-t0-title continuity-repair-t0-desc"><title id="continuity-repair-t0-title">输入a附近的规则与点值</title><desc id="continuity-repair-t0-desc">横轴表示x−a，横坐标0对应输入a。左线段从(-1,5)到(0,6)，右线段从(0,6)到(1,7)；(0,6)为空心位置，(0,8)为实心点。</desc><rect width="640" height="320" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#25334b"><text x="68" y="24" font-weight="600">输入a附近的规则与点值</text><line x1="158" y1="42" x2="158" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="158" y="284" text-anchor="middle">-1</text><line x1="338" y1="42" x2="338" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="338" y="284" text-anchor="middle">0</text><line x1="518" y1="42" x2="518" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="518" y="284" text-anchor="middle">1</text><line x1="68" y1="218" x2="608" y2="218" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="223" text-anchor="end">5</text><line x1="68" y1="174" x2="608" y2="174" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="179" text-anchor="end">6</text><line x1="68" y1="130" x2="608" y2="130" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="135" text-anchor="end">7</text><line x1="68" y1="86" x2="608" y2="86" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="91" text-anchor="end">8</text><line x1="68" y1="42" x2="68" y2="262" stroke="#475569" stroke-width="1.5"/><line x1="68" y1="262" x2="608" y2="262" stroke="#475569" stroke-width="1.5"/><text x="605" y="309" text-anchor="end">输入与a的差（x−a）</text><text x="68" y="39" font-size="12">y</text><polyline points="158,218 338,174" fill="none" stroke="#5b47b5" stroke-width="3"/><polyline points="338,174 518,130" fill="none" stroke="#5b47b5" stroke-width="3"/><circle cx="338" cy="174" r="6" fill="white" stroke="#233c64" stroke-width="2.5"/><circle cx="338" cy="86" r="6" fill="#233c64" stroke="#233c64" stroke-width="2.5"/></g></svg>