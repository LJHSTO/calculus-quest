<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="transfer-temperature-samples-title transfer-temperature-samples-desc"><title id="transfer-temperature-samples-title">每小时记录的温度</title><desc id="transfer-temperature-samples-desc">五个记录点依次为(0小时,18度)、(1小时,19度)、(2小时,20度)、(3小时,21度)、(4小时,22度)。点间没有连线，未给出其间的温度记录。</desc><rect width="640" height="320" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#25334b"><text x="68" y="24" font-weight="600">每小时记录的温度</text><line x1="103.2174" y1="42" x2="103.2174" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="103.2174" y="284" text-anchor="middle">0</text><line x1="220.6087" y1="42" x2="220.6087" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="220.6087" y="284" text-anchor="middle">1</text><line x1="338" y1="42" x2="338" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="338" y="284" text-anchor="middle">2</text><line x1="455.3913" y1="42" x2="455.3913" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="455.3913" y="284" text-anchor="middle">3</text><line x1="572.7826" y1="42" x2="572.7826" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="572.7826" y="284" text-anchor="middle">4</text><line x1="68" y1="225.3333" x2="608" y2="225.3333" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="230.3333" text-anchor="end">18</text><line x1="68" y1="188.6667" x2="608" y2="188.6667" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="193.6667" text-anchor="end">19</text><line x1="68" y1="152" x2="608" y2="152" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="157" text-anchor="end">20</text><line x1="68" y1="115.3333" x2="608" y2="115.3333" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="120.3333" text-anchor="end">21</text><line x1="68" y1="78.6667" x2="608" y2="78.6667" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="83.6667" text-anchor="end">22</text><line x1="68" y1="42" x2="68" y2="262" stroke="#475569" stroke-width="1.5"/><line x1="68" y1="262" x2="608" y2="262" stroke="#475569" stroke-width="1.5"/><text x="605" y="309" text-anchor="end">时间（小时）</text><text x="68" y="39" font-size="12">温度（°C）</text><circle cx="103.2174" cy="225.3333" r="5.5" fill="#b85a10"/><circle cx="220.6087" cy="188.6667" r="5.5" fill="#b85a10"/><circle cx="338" cy="152" r="5.5" fill="#b85a10"/><circle cx="455.3913" cy="115.3333" r="5.5" fill="#b85a10"/><circle cx="572.7826" cy="78.6667" r="5.5" fill="#b85a10"/></g></svg>