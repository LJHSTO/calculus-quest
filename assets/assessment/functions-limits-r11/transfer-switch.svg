<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="transfer-switch-title transfer-switch-desc"><title id="transfer-switch-title">切换时刻附近的设备读数</title><desc id="transfer-switch-desc">左线段从(-2,10)到(0,12)，右线段从(0,15)到(2,17)；(0,12)与(0,15)是空心位置，(0,13.5)是实心点。</desc><rect width="640" height="320" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#25334b"><text x="68" y="24" font-weight="600">切换时刻附近的设备读数</text><line x1="122" y1="42" x2="122" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="122" y="284" text-anchor="middle">-2</text><line x1="230" y1="42" x2="230" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="230" y="284" text-anchor="middle">-1</text><line x1="338" y1="42" x2="338" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="338" y="284" text-anchor="middle">0</text><line x1="446" y1="42" x2="446" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="446" y="284" text-anchor="middle">1</text><line x1="554" y1="42" x2="554" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="554" y="284" text-anchor="middle">2</text><line x1="68" y1="237.5556" x2="608" y2="237.5556" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="242.5556" text-anchor="end">10</text><line x1="68" y1="188.6667" x2="608" y2="188.6667" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="193.6667" text-anchor="end">12</text><line x1="68" y1="152" x2="608" y2="152" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="157" text-anchor="end">13.5</text><line x1="68" y1="115.3333" x2="608" y2="115.3333" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="120.3333" text-anchor="end">15</text><line x1="68" y1="66.4444" x2="608" y2="66.4444" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="71.4444" text-anchor="end">17</text><line x1="68" y1="42" x2="68" y2="262" stroke="#475569" stroke-width="1.5"/><line x1="68" y1="262" x2="608" y2="262" stroke="#475569" stroke-width="1.5"/><text x="605" y="309" text-anchor="end">距切换