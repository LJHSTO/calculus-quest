<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="x-point-membership-title x-point-membership-desc"><title id="x-point-membership-title">函数曲线与待审核标记</title><desc id="x-point-membership-desc">横轴从0到4，紫色直线经过(0,1)和(4,9)。橙色菱形甲位于(2,5)，乙位于(3,5)。菱形是待审核标记。</desc><rect width="640" height="320" fill="white"/><g font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="16" fill="#25334b"><text x="68" y="24" font-weight="600">函数曲线与待审核标记</text><line x1="68" y1="42" x2="68" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="68" y="284" text-anchor="middle">0</text><line x1="203" y1="42" x2="203" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="203" y="284" text-anchor="middle">1</text><line x1="338" y1="42" x2="338" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="338" y="284" text-anchor="middle">2</text><line x1="473" y1="42" x2="473" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="473" y="284" text-anchor="middle">3</text><line x1="608" y1="42" x2="608" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="608" y="284" text-anchor="middle">4</text><line x1="68" y1="262" x2="608" y2="262" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="267" text-anchor="end">0</text><line x1="68" y1="152" x2="608" y2="152" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="157" text-anchor="end">5</text><line x1="68" y1="108" x2="608" y2="108" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="113" text-anchor="end">7</text><line x1="68" y1="64" x2="608" y2="64" stroke="#dbe2ed" stroke-width="1"/><text x="57" y="69" text-anchor="end">9</text><line x1="68" y1="42" x2="68" y2="262" stroke="#475569" stroke-width="1.5"/><line x1="68" y1="262" x2="608" y2="262" stroke="#475569" stroke-width="1.5"/><text x="605" y="309" text-anchor="end">x</text><text x="68" y="39" font-size="12">y</text><polyline points="68,240 608,64" fill="none" stroke="#5b47b5" stroke-width="3"/><path d="M338 145L345 152L338 159L331 152Z" fill="#c66a19"/><text x="3